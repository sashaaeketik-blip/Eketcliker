<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b19">
<title>Деревня — Eket Clicker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b19;font-family:Arial,sans-serif;touch-action:none}
#scene{display:block;width:100vw;height:100dvh;touch-action:none}
#topbar{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
button{pointer-events:auto;border:1px solid #ffffff35;background:#172b25eF;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;box-shadow:0 3px 12px #0005}
#hint{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14251fe8;color:#fff;border:1px solid #ffffff25;border-radius:12px;padding:9px 13px;font-size:13px;white-space:nowrap;pointer-events:none}
#status{position:fixed;top:62px;left:50%;transform:translateX(-50%);color:#fff;background:#14251fe8;border-radius:10px;padding:7px 11px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .25s}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="topbar">
  <button id="back">← Назад в игру</button>
  <button id="center">К герою</button>
</div>
<div id="status"></div>
<div id="hint">Нажми на землю, чтобы пройти туда</div>
<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const map = new Image();
  const hero = new Image();
  map.src = './village-map.png';
  hero.src = './eket-hero.png';

  const WORLD_W = 1536, WORLD_H = 1024;
  let dpr=1, viewW=0, viewH=0, scale=1, camX=768, camY=512;
  const player={x:768,y:520,tx:768,ty:520,speed:190};
  let mapReady=false, heroReady=false, last=0;
  let facing=1, moving=false;
  const obstacles=[
    {x:210,y:180,w:250,h:145},{x:590,y:130,w:250,h:150},
    {x:1080,y:190,w:250,h:145},{x:100,y:590,w:250,h:150},
    {x:1180,y:620,w:250,h:150},{x:580,y:790,w:300,h:130}
  ];

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    viewW=innerWidth; viewH=innerHeight;
    canvas.width=Math.round(viewW*dpr); canvas.height=Math.round(viewH*dpr);
    canvas.style.width=viewW+'px'; canvas.style.height=viewH+'px';
    scale=Math.min(viewW/WORLD_W,viewH/WORLD_H)*1.12;
  }
  addEventListener('resize',resize); resize();

  function say(message){
    const el=document.getElementById('status');
    el.textContent=message; el.style.opacity=1;
    clearTimeout(say.timer); say.timer=setTimeout(()=>el.style.opacity=0,1800);
  }
  map.onload=()=>{mapReady=true;say('Карта деревни загружена')};
  map.onerror=()=>say('Не удалось загрузить village-map.png');
  hero.onload=()=>{heroReady=true;say('Модель героя загружена')};
  hero.onerror=()=>say('Не удалось загрузить eket-hero.png');

  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function blocked(x,y){
    return obstacles.some(o=>x>o.x-24&&x<o.x+o.w+24&&y>o.y-18&&y<o.y+o.h+18);
  }
  function worldPoint(clientX,clientY){
    const sx=(clientX-viewW/2)/scale+camX;
    const sy=(clientY-viewH/2)/scale+camY;
    return {x:sx,y:sy};
  }
  canvas.addEventListener('pointerdown',e=>{
    const p=worldPoint(e.clientX,e.clientY);
    const x=clamp(p.x,45,WORLD_W-45), y=clamp(p.y,55,WORLD_H-55);
    if(!blocked(x,y)){player.tx=x;player.ty=y;}
    else say('Туда пройти нельзя');
  });

  document.getElementById('center').onclick=()=>{player.tx=player.x;player.ty=player.y;camX=player.x;camY=player.y};
  document.getElementById('back').onclick=()=>{
    if(history.length>1) history.back(); else location.href='./index.html';
  };

  function drawFallback(){
    const g=ctx.createLinearGradient(0,0,viewW,viewH);
    g.addColorStop(0,'#527c50');g.addColorStop(1,'#294c39');
    ctx.fillStyle=g;ctx.fillRect(0,0,viewW,viewH);
    ctx.fillStyle='#f4e7c2';ctx.font='bold 25px Arial';ctx.textAlign='center';
    ctx.fillText('EKET VILLAGE',viewW/2,viewH/2);
    ctx.font='14px Arial';ctx.fillText('Загрузи village-map.png в корень репозитория',viewW/2,viewH/2+30);
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,viewW,viewH);
    if(!mapReady){drawFallback();return}
    ctx.save();
    ctx.translate(viewW/2,viewH/2);
    ctx.scale(scale,scale);
    ctx.translate(-camX,-camY);
    ctx.drawImage(map,0,0,WORLD_W,WORLD_H);

    // Маркер цели
    if(Math.hypot(player.tx-player.x,player.ty-player.y)>12){
      ctx.beginPath();ctx.ellipse(player.tx,player.ty+8,13,6,0,0,Math.PI*2);
      ctx.fillStyle='#ffe58a99';ctx.fill();
      ctx.beginPath();ctx.arc(player.tx,player.ty-3,5,0,Math.PI*2);
      ctx.fillStyle='#fff1a8';ctx.fill();
    }

    // Тень героя
    ctx.beginPath();ctx.ellipse(player.x,player.y+22,19,8,0,0,Math.PI*2);
    ctx.fillStyle='#0007';ctx.fill();

    if(heroReady){
      const w=58,h=76;
      ctx.save();
      if(facing<0){ctx.translate(player.x*2,0);ctx.scale(-1,1)}
      ctx.drawImage(hero,player.x-w/2,player.y-h+23,w,h);
      ctx.restore();
    }else{
      ctx.fillStyle='#f0c28a';ctx.beginPath();ctx.arc(player.x,player.y-15,11,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#355b9a';ctx.fillRect(player.x-10,player.y-5,20,25);
    }
    ctx.restore();
  }

  function tick(t){
    const dt=Math.min((t-last)/1000||0,0.04);last=t;
    const dx=player.tx-player.x,dy=player.ty-player.y,dist=Math.hypot(dx,dy);
    moving=dist>3;
    if(moving){
      facing=dx<0?-1:1;
      const step=Math.min(dist,player.speed*dt);
      const nx=player.x+dx/dist*step,ny=player.y+dy/dist*step;
      if(!blocked(nx,ny)){player.x=nx;player.y=ny}
      else {player.tx=player.x;player.ty=player.y}
    }
    camX+=(player.x-camX)*Math.min(1,dt*4);
    camY+=(player.y-camY)*Math.min(1,dt*4);
    draw();requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>

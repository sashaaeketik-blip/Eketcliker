
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b19">
<title>Eket Clicker</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:#0b1211;
 color:#e5eee9;
 font-family:Georgia,serif;
}

.game{
 max-width:600px;
 min-height:100vh;
 margin:auto;
 overflow:hidden;
 background:linear-gradient(180deg,#172521,#101916 65%,#0c1412);
 box-shadow:0 0 35px #000;
}

header{
 position:relative;
 text-align:center;
 padding:17px 12px 12px;
 background:linear-gradient(180deg,#263a32,#192720);
 border-bottom:1px solid #ffffff12;
}

h1{
 margin:0;
 color:#d8e6d9;
 font-size:23px;
 letter-spacing:3px;
 font-weight:normal;
}

.subtitle{
 margin-top:5px;
 color:#91a89a;
 font-size:12px;
 letter-spacing:1px;
}

.sound-button{
 position:absolute;
 right:12px;
 top:15px;
 border:0;
 background:#ffffff0d;
 color:#c6d5cb;
 border-radius:50%;
 width:38px;
 height:38px;
 font-size:17px;
 padding:0;
 box-shadow:none;
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:1px;
 background:#ffffff12;
 border-bottom:1px solid #ffffff12;
}

.stat{
 text-align:center;
 padding:12px 4px;
 background:#14201c;
 color:#91a89a;
 font-size:11px;
 letter-spacing:.5px;
}

.stat b{
 display:block;
 margin-top:5px;
 color:#e0e9e1;
 font-size:18px;
 font-weight:normal;
}

.arena{
 position:relative;
 width:100%;
 aspect-ratio:1.5;
 overflow:hidden;
 background:#17251e;
}

.arena>img.background{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
 z-index:0;
 filter:brightness(.76) saturate(.78);
}

.arena:after{
 content:"";
 position:absolute;
 inset:0;
 z-index:2;
 pointer-events:none;
 background:linear-gradient(180deg,#08120b22,transparent 45%,#08120b66);
}

.monster{
 position:absolute;
 right:8%;
 bottom:3%;
 width:27%;
 height:38%;
 object-fit:contain;
 object-position:center bottom;
 display:block;
 z-index:4;
 cursor:pointer;
 filter:drop-shadow(0 7px 5px #0009);
 transform-origin:center bottom;
 -webkit-tap-highlight-color:transparent;
}

.hero{
 position:absolute;
 left:8%;
 bottom:7%;
 width:37%;
 height:78%;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 z-index:3;
 pointer-events:none;
}

.hero-idle{
 width:100%;
 height:100%;
 object-fit:contain;
 object-position:center bottom;
 filter:drop-shadow(0 7px 5px #0009);
 transform-origin:bottom center;
}

.arena.hit .hero-idle,.arena.dodge .hero-idle{
 animation:heroAttack .45s ease-in-out;
}

@keyframes heroAttack{
 0%{transform:translateX(0) rotate(0) scale(1)}
 40%{transform:translateX(35px) rotate(-8deg) scale(1.08)}
 70%{transform:translateX(25px) rotate(5deg) scale(1.04)}
 100%{transform:translateX(0) rotate(0) scale(1)}
}

.arena.hit .monster{animation:monsterKnockback .42s ease-out}

@keyframes monsterKnockback{
 0%{transform:translateX(0) rotate(0) scale(1)}
 25%{transform:translateX(35px) rotate(18deg) scale(.82)}
 55%{transform:translateX(20px) rotate(-12deg) scale(.9)}
 100%{transform:translateX(0) rotate(0) scale(1)}
}

.arena.dodge .monster{animation:monsterDodge .48s ease-in-out}

@keyframes monsterDodge{
 0%{transform:translateX(0) rotate(0)}
 35%{transform:translateX(-45px) rotate(-18deg) scale(.85)}
 65%{transform:translateX(-30px) rotate(12deg)}
 100%{transform:translateX(0) rotate(0) scale(1)}
}

.arena.dying .monster{animation:monsterDeath .7s ease-in forwards!important}

@keyframes monsterDeath{
 0%{opacity:1;transform:translateY(0) rotate(0) scale(1)}
 35%{opacity:1;transform:translateY(-55px) rotate(35deg) scale(1.15)}
 100%{opacity:0;transform:translateY(35px) rotate(180deg) scale(.05)}
}

.damage-pop{
 position:absolute;
 right:20%;
 bottom:48%;
 z-index:6;
 color:#e5e8bd;
 font:bold 25px Georgia,serif;
 text-shadow:0 2px 8px #000;
 opacity:0;
 pointer-events:none;
 white-space:nowrap;
}

.arena.hit .damage-pop{animation:damagePop .55s ease-out}

@keyframes damagePop{
 0%{opacity:0;transform:translateY(15px) scale(.7)}
 25%{opacity:1}
 100%{opacity:0;transform:translateY(-40px) scale(1.2)}
}

.damage-pop.critical{
 color:#f4d18a;
 font-size:32px;
 text-shadow:0 0 12px #b76d32,0 2px 6px #000;
}

.arena.hit .damage-pop.critical{animation:criticalPop .8s ease-out}

@keyframes criticalPop{
 0%{opacity:0;transform:translateY(20px) scale(.3) rotate(-10deg)}
 25%{opacity:1;transform:translateY(-5px) scale(1.35) rotate(5deg)}
 45%{transform:translateY(-12px) scale(1.1)}
 100%{opacity:0;transform:translateY(-65px) scale(1.4)}
}

.damage-pop.evaded{
 color:#b4d8d4;
 font-size:20px;
 text-shadow:0 0 8px #397e78,0 2px 5px #000;
}

.arena.dodge .damage-pop{animation:dodgePop .65s ease-out}

@keyframes dodgePop{
 0%{opacity:0;transform:translateY(10px) scale(.6)}
 25%{opacity:1;transform:translateY(-5px) scale(1.15)}
 100%{opacity:0;transform:translateY(-45px) scale(1)}
}

.enemy{
 padding:13px 18px 15px;
 text-align:center;
 background:#14201c;
 border-top:1px solid #ffffff12;
 border-bottom:1px solid #ffffff12;
}

.enemy b{
 color:#dce8df;
 font-size:15px;
 font-weight:normal;
 letter-spacing:.5px;
}

.bar{
 height:5px;
 background:#26342d;
 border-radius:10px;
 overflow:hidden;
 margin-top:11px;
}

.bar span{
 display:block;
 height:100%;
 width:100%;
 background:linear-gradient(90deg,#8b5549,#b87967);
 transition:width .2s;
}

#enemyHP{
 margin-top:6px;
 color:#82968a;
 font-size:11px;
}

.attack{
 display:none;
}

.section{
 margin:14px 12px;
 padding:14px;
 background:#17241e;
 border:1px solid #ffffff12;
 border-radius:10px;
 box-shadow:0 5px 15px #0003;
}

.section h2{
 margin:0 0 13px;
 color:#cbd9ce;
 font-size:16px;
 font-weight:normal;
 letter-spacing:.5px;
}

.upgrade{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:11px 0;
 border-top:1px solid #ffffff12;
}

.upgrade b{color:#d8e4da;font-weight:normal}

.upgrade p{
 margin:5px 0 0;
 color:#84998c;
 font-size:12px;
}

.upgrade button{
 border:1px solid #506b59;
 border-radius:7px;
 background:#263d30;
 color:#d8e6d9;
 padding:9px 13px;
 font-size:12px;
 box-shadow:none;
 white-space:nowrap;
}

.upgrade button:active{
 transform:scale(.96);
}

.section>p{
 color:#8da194;
 margin:12px 0 0;
 font-size:12px;
}

.section>p b{color:#d5e2d7;font-weight:normal}

.note{
 text-align:center;
 color:#64796d;
 padding:15px 12px 22px;
 font-size:11px;
}

@media(max-width:380px){
 h1{font-size:20px}
 .stat b{font-size:16px}
 .section h2{font-size:15px}
 .upgrade{gap:6px}
 .upgrade button{padding:8px 10px}
}
</style>
</head>

<body>
<div class="game">

<header>
<h1>EKET CLICKER</h1>
<div class="subtitle">Лесные земли</div>
<button class="sound-button" id="soundButton" onclick="toggleSound()">♪</button>
</header>

<div class="stats">
<div class="stat">ЗОЛОТО<b id="gold">0</b></div>
<div class="stat">УРОВЕНЬ<b id="level">1</b></div>
<div class="stat">ОПЫТ<b id="xp">0 / 50</b></div>
</div>

<div class="arena" id="arena">
<img class="background" src="./forest.png" alt="Лес">
<div class="hero">
<img class="hero-idle" src="./eket-hero.png" alt="Герой Eket">
</div>
<img class="monster" id="monster" src="./slime.png?v=2" alt="Лесной слизень">
<div class="damage-pop" id="damagePop">-1</div>
</div>

<div class="enemy">
<b id="enemyName">Лесной слизень</b>
<div class="bar"><span id="enemyBar"></span></div>
<div id="enemyHP">30 / 30 HP</div>
</div>

<div class="section">
<h2>Улучшения</h2>
<div class="upgrade">
<div>
<b>Сильный удар</b>
<p>Урон +1 · Цена: <span id="price">25</span> золота</p>
</div>
<button onclick="upgrade()">Улучшить</button>
</div>
<p>Текущий урон: <b id="damage">1</b></p>
</div>

<div class="note">Нажимай на противника, чтобы атаковать</div>
</div>

<script>
let saved={};
try{
 saved=JSON.parse(localStorage.getItem("eket-clicker-save")||"{}");
}catch(e){}

let gold=saved.gold??0;
let level=saved.level??1;
let xp=saved.xp??0;
let damage=saved.damage??1;
let price=saved.price??25;
let maxHP=saved.maxHP??30;
let hp=saved.hp??maxHP;

const CRIT_CHANCE=0.30;
const CRIT_MULTIPLIER=2;
const DODGE_CHANCE=0.10;

let isMonsterDying=false;
let attackLocked=false;
let attackTimer;

let audioContext=null;
let soundEnabled=false;
let musicTimer=null;
let musicStep=0;

function getAudio(){
 const AudioCtx=window.AudioContext||window.webkitAudioContext;
 if(!AudioCtx)return null;
 if(!audioContext)audioContext=new AudioCtx();
 if(audioContext.state==="suspended")audioContext.resume();
 return audioContext;
}

function tone(frequency,duration,type="sine",volume=0.08,slide=0){
 if(!soundEnabled)return;
 const ctx=getAudio();
 if(!ctx)return;
 const osc=ctx.createOscillator();
 const gain=ctx.createGain();
 const now=ctx.currentTime;
 osc.type=type;
 osc.frequency.setValueAtTime(frequency,now);
 if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(1,frequency+slide),now+duration);
 gain.gain.setValueAtTime(volume,now);
 gain.gain.exponentialRampToValueAtTime(0.001,now+duration);
 osc.connect(gain);
 gain.connect(ctx.destination);
 osc.start(now);
 osc.stop(now+duration);
}

function playHit(){
 tone(150,0.12,"sawtooth",0.12,-75);
 setTimeout(()=>tone(85,0.10,"triangle",0.07,-25),45);
}

function playDodge(){
 tone(520,0.16,"sine",0.07,420);
}

function playCritical(){
 tone(220,0.16,"sawtooth",0.10,260);
 setTimeout(()=>tone(440,0.22,"triangle",0.08,180),90);
}

function playVictory(){
 [392,494,587,784].forEach((f,i)=>setTimeout(()=>tone(f,0.32,"triangle",0.08),i*130));
}

function playPurchase(){
 tone(660,0.10,"sine",0.07,120);
 setTimeout(()=>tone(880,0.16,"sine",0.07,100),100);
}

const melody=[
 [392,494,587,494],
 [330,392,494,392],
 [349,440,523,440],
 [294,392,494,392]
];

function musicTick(){
 if(!soundEnabled)return;
 const phrase=melody[Math.floor(musicStep/4)%melody.length];
 const note=phrase[musicStep%4];
 tone(note,0.48,"triangle",0.025);
 if(musicStep%4===0)tone(note/2,0.75,"sine",0.018);
 musicStep++;
}

function toggleSound(){
 soundEnabled=!soundEnabled;
 const button=document.getElementById("soundButton");

 if(soundEnabled){
  getAudio();
  button.textContent="♫";
  musicTick();
  musicTimer=setInterval(musicTick,520);
 }else{
  clearInterval(musicTimer);
  musicTimer=null;
  button.textContent="♪";
 }
}

function save(){
 localStorage.setItem("eket-clicker-save",JSON.stringify({
  gold,level,xp,damage,price,maxHP,hp
 }));
}

function render(){
 document.getElementById("gold").textContent=gold;
 document.getElementById("level").textContent=level;
 document.getElementById("xp").textContent=xp+" / "+(level*50);
 document.getElementById("damage").textContent=damage;
 document.getElementById("price").textContent=price;
 document.getElementById("enemyHP").textContent=hp+" / "+maxHP+" HP";
 document.getElementById("enemyBar").style.width=Math.max(0,hp/maxHP*100)+"%";
}

function resetAnimation(){
 const arena=document.getElementById("arena");
 arena.classList.remove("hit","dodge","dying");
 void arena.offsetWidth;
}

function attack(){
 if(isMonsterDying||attackLocked)return;
 attackLocked=true;

 const arena=document.getElementById("arena");
 const pop=document.getElementById("damagePop");

 resetAnimation();
 pop.className="damage-pop";

 if(Math.random()<DODGE_CHANCE){
  playDodge();
  pop.textContent="УКЛОНЕНИЕ!";
  pop.classList.add("evaded");
  arena.classList.add("dodge");

  clearTimeout(attackTimer);
  attackTimer=setTimeout(()=>{
   resetAnimation();
   attackLocked=false;
  },550);

  return;
 }

 let actualDamage=damage;
 let isCritical=false;

 if(Math.random()<CRIT_CHANCE){
  actualDamage=damage*CRIT_MULTIPLIER;
  isCritical=true;
 }

 hp-=actualDamage;

 if(isCritical){
  playCritical();
 }else{
  playHit();
 }

 pop.textContent=isCritical?"КРИТ! -"+actualDamage:"-"+actualDamage;

 if(isCritical)pop.classList.add("critical");
 arena.classList.add("hit");

 if(hp<=0){
  hp=0;
  isMonsterDying=true;
  render();
  save();

  arena.classList.add("dying");

  clearTimeout(attackTimer);
  attackTimer=setTimeout(()=>{
   playVictory();

   gold+=5+level;
   xp+=10;

   if(xp>=level*50){
    xp-=level*50;
    level++;
   }

   maxHP=Math.floor(maxHP*1.2);
   hp=maxHP;
   isMonsterDying=false;

   resetAnimation();
   render();
   save();
   attackLocked=false;
  },750);

  return;
 }

 render();
 save();

 clearTimeout(attackTimer);
 attackTimer=setTimeout(()=>{
  resetAnimation();
  attackLocked=false;
 },500);
}

function upgrade(){
 if(gold<price){
  alert("Не хватает золота!");
  return;
 }

 gold-=price;
 damage++;
 price+=25;

 playPurchase();
 save();
 render();
}

document.getElementById("monster").addEventListener("click",attack);
document.getElementById("monster").addEventListener("touchend",function(e){
 e.preventDefault();
 attack();
},{passive:false});

render();

document.getElementById("monster").addEventListener("error",function(){
 console.error("Не удалось загрузить slime.png");
 this.alt="Ошибка загрузки slime.png";
});
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#263b63">
<title>Eket Clicker</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:radial-gradient(ellipse at 50% 0%,#526e9b,#263b63 45%,#111b35);
 color:white;
 font-family:Georgia,serif;
 min-height:100vh;
}

.game{
 max-width:600px;
 margin:auto;
 min-height:100vh;
 overflow:hidden;
 background:linear-gradient(180deg,#344e79,#202e50 55%,#18213b);
 box-shadow:0 0 40px #000b;
 border-left:3px solid #718db8;
 border-right:3px solid #718db8;
}

header{
 text-align:center;
 padding:22px 14px 18px;
 background:radial-gradient(ellipse at 50% 0%,#ffe39b,#e89a45 25%,transparent 70%),linear-gradient(180deg,#87503c,#493047 65%,#283653);
 border-bottom:5px solid #f5c66c;
 box-shadow:0 7px 0 #493047,0 12px 20px #0008;
 position:relative;
}

h1{
 margin:0;
 color:#fff3b8;
 font-size:30px;
 letter-spacing:2px;
 text-shadow:0 2px 0 #a95b25,0 4px 0 #65351e,0 6px 8px #24101b,0 0 18px #ffd36a;
}

header div{
 margin-top:8px;
 color:#ffe4b0;
 font-size:14px;
 text-shadow:0 2px 3px #42231f;
}

button{
 font-family:inherit;
 color:#fff;
 border:2px solid #f6d17c;
 border-radius:14px;
 background:linear-gradient(180deg,#e7a54e,#a95c2b);
 padding:13px;
 font-size:16px;
 font-weight:bold;
 box-shadow:inset 0 2px 4px #ffffff75,0 5px 0 #65351f,0 8px 12px #0007;
 transition:transform .12s,filter .12s;
}

button:active{
 transform:translateY(3px) scale(.98);
 filter:brightness(1.15);
}

button:disabled{opacity:.5}

.sound-button{
 margin-top:14px;
 padding:10px 16px;
 font-size:13px;
 background:linear-gradient(#8e75c5,#55428c);
 border:2px solid #c9b5ff;
 border-radius:15px;
 box-shadow:0 4px 0 #302453,0 7px 10px #0007,inset 0 2px 3px #fff8;
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
 padding:15px 11px;
}

.stat{
 text-align:center;
 padding:11px 4px;
 border:2px solid #f6d17c;
 border-radius:15px;
 background:linear-gradient(145deg,#547fbd,#294b80 60%,#20385f);
 color:#fff4ce;
 font-size:12px;
 box-shadow:inset 0 3px 5px #ffffff55,inset 0 -5px 8px #13274b88,0 5px 0 #172b4d,0 8px 12px #0007;
 text-shadow:0 2px 3px #172b4d;
}

.stat b{
 display:block;
 color:#ffe78e;
 font-size:21px;
 margin-top:6px;
 text-shadow:0 2px 0 #8d552b,0 3px 5px #0009;
}

.arena{
 position:relative;
 width:calc(100% - 20px);
 margin:4px 10px 0;
 aspect-ratio:1.5;
 overflow:hidden;
 background:#426b55;
 border:4px solid #f4ca75;
 border-radius:18px;
 box-shadow:0 0 0 3px #62432d,0 7px 0 #392a32,0 12px 18px #000a,inset 0 0 20px #fff4;
}

.arena>img.background{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
 z-index:0;
}

.arena:before{
 content:"";
 position:absolute;
 inset:0;
 z-index:2;
 pointer-events:none;
 background:linear-gradient(180deg,#ffffff15,transparent 30%,transparent 75%,#07152255);
}

.monster{
 position:absolute;
 right:8%;
 bottom:3%;
 width:27%;
 height:38%;
 object-fit:contain;
 object-position:center bottom;
 display:block;
 z-index:4;
 filter:drop-shadow(0 7px 0 #193b34) drop-shadow(0 10px 5px #0008);
 transform-origin:center bottom;
}

.hero{
 position:absolute;
 left:8%;
 bottom:7%;
 width:37%;
 height:78%;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 z-index:3;
 pointer-events:none;
}

.hero-idle{
 width:100%;
 height:100%;
 object-fit:contain;
 object-position:center bottom;
 filter:drop-shadow(0 7px 0 #26374b) drop-shadow(0 10px 5px #0009);
 transform-origin:bottom center;
}

.arena.hit .hero-idle,.arena.dodge .hero-idle{
 animation:heroAttack .45s ease-in-out;
}

@keyframes heroAttack{
 0%{transform:translateX(0) rotate(0) scale(1)}
 40%{transform:translateX(35px) rotate(-8deg) scale(1.08)}
 70%{transform:translateX(25px) rotate(5deg) scale(1.04)}
 100%{transform:translateX(0) rotate(0) scale(1)}
}

.arena.hit .monster{animation:monsterKnockback .42s ease-out}

@keyframes monsterKnockback{
 0%{transform:translateX(0) rotate(0) scale(1)}
 25%{transform:translateX(35px) rotate(18deg) scale(.82)}
 55%{transform:translateX(20px) rotate(-12deg) scale(.9)}
 100%{transform:translateX(0) rotate(0) scale(1)}
}

.arena.dodge .monster{animation:monsterDodge .48s ease-in-out}

@keyframes monsterDodge{
 0%{transform:translateX(0) rotate(0)}
 35%{transform:translateX(-45px) rotate(-18deg) scale(.85)}
 65%{transform:translateX(-30px) rotate(12deg)}
 100%{transform:translateX(0) rotate(0) scale(1)}
}

.arena.dying .monster{animation:monsterDeath .7s ease-in forwards!important}

@keyframes monsterDeath{
 0%{opacity:1;transform:translateY(0) rotate(0) scale(1)}
 35%{opacity:1;transform:translateY(-55px) rotate(35deg) scale(1.15)}
 100%{opacity:0;transform:translateY(35px) rotate(180deg) scale(.05)}
}

.damage-pop{
 position:absolute;
 right:20%;
 bottom:48%;
 z-index:6;
 color:#fff36c;
 font:bold 27px Georgia,serif;
 text-shadow:0 3px 0 #9d401d,0 5px 8px #000;
 opacity:0;
 pointer-events:none;
 white-space:nowrap;
}

.arena.hit .damage-pop{animation:damagePop .55s ease-out}

@keyframes damagePop{
 0%{opacity:0;transform:translateY(15px) scale(.7)}
 25%{opacity:1}
 100%{opacity:0;transform:translateY(-40px) scale(1.2)}
}

.damage-pop.critical{
 color:#fff34a;
 font-size:36px;
 font-weight:bold;
 text-shadow:0 0 8px #ff3c00,0 0 18px #ff9900,0 3px 5px #000;
}

.arena.hit .damage-pop.critical{animation:criticalPop .8s ease-out}

@keyframes criticalPop{
 0%{opacity:0;transform:translateY(20px) scale(.3) rotate(-10deg)}
 25%{opacity:1;transform:translateY(-5px) scale(1.35) rotate(5deg)}
 45%{transform:translateY(-12px) scale(1.1)}
 100%{opacity:0;transform:translateY(-65px) scale(1.4)}
}

.damage-pop.evaded{
 color:#9af2ff;
 font-size:23px;
 text-shadow:0 0 8px #00aaff,0 2px 5px #000;
}

.arena.dodge .damage-pop{animation:dodgePop .65s ease-out}

@keyframes dodgePop{
 0%{opacity:0;transform:translateY(10px) scale(.6)}
 25%{opacity:1;transform:translateY(-5px) scale(1.15)}
 100%{opacity:0;transform:translateY(-45px) scale(1)}
}

.enemy{
 margin:15px 10px 0;
 padding:15px;
 text-align:center;
 background:linear-gradient(145deg,#5a6598,#343d70 65%,#252b50);
 border:3px solid #f4cf7c;
 border-radius:16px;
 box-shadow:inset 0 3px 5px #ffffff35,inset 0 -5px 8px #111a3a88,0 5px 0 #172342,0 9px 14px #0007;
}

.enemy b{
 color:#fff0b0;
 font-size:17px;
 text-shadow:0 2px 4px #151a39;
}

.bar{
 height:18px;
 background:#17192d;
 border:2px solid #e8c77d;
 border-radius:20px;
 overflow:hidden;
 margin-top:10px;
 box-shadow:inset 0 3px 5px #000b;
}

.bar span{
 display:block;
 height:100%;
 width:100%;
 background:linear-gradient(180deg,#ff8b75,#ed3f50 55%,#a7193c);
 box-shadow:0 0 12px #ff455d;
 transition:width .2s;
}

#enemyHP{
 margin-top:7px;
 color:#fff0d0;
 font-size:13px;
 text-shadow:0 2px 3px #000;
}

.attack{
 display:block;
 width:90%;
 margin:19px auto;
 background:linear-gradient(180deg,#ff8061 0%,#ed493d 45%,#a92735 100%);
 border:3px solid #ffe08b;
 border-radius:17px;
 font-size:23px;
 padding:18px;
 letter-spacing:1px;
 color:#fff8df;
 text-shadow:0 2px 0 #8d242c,0 4px 5px #48101b;
 box-shadow:inset 0 3px 5px #ffffff85,inset 0 -5px 8px #761e3188,0 6px 0 #70212b,0 10px 16px #0009,0 0 18px #ff654e55;
}

.attack:active{
 transform:translateY(4px) scale(.98);
 box-shadow:inset 0 3px 5px #0005,0 2px 0 #70212b;
}

.section{
 margin:14px 10px;
 padding:16px;
 background:linear-gradient(145deg,#526b9b,#303f70 65%,#263154);
 border:3px solid #eac879;
 border-radius:17px;
 box-shadow:inset 0 3px 6px #ffffff35,inset 0 -6px 9px #111a3a88,0 5px 0 #172342,0 10px 15px #0008;
}

.section h2{
 margin:0 0 15px;
 color:#fff0ae;
 font-size:20px;
 text-shadow:0 2px 0 #8d582d,0 4px 5px #0008;
}

.upgrade{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:12px;
 background:linear-gradient(145deg,#6687ba,#3b5688 65%,#2b3e68);
 border:2px solid #b9d5f1;
 border-radius:13px;
 box-shadow:inset 0 2px 5px #ffffff45,0 4px 0 #1d3154,0 6px 9px #0006;
}

.upgrade b{color:#fff0b4}

.upgrade p{
 margin:5px 0 0;
 color:#e4eaff;
 font-size:13px;
}

.upgrade button{
 font-size:13px;
 padding:11px 13px;
 white-space:nowrap;
 background:linear-gradient(#8bca70,#3c8a52);
 border-color:#d3f6a2;
 box-shadow:inset 0 2px 4px #ffffff88,0 4px 0 #235432,0 6px 9px #0007;
}

.section>p{
 color:#e1eaff;
 margin:14px 2px 0;
 font-size:14px;
}

.section>p b{color:#ffe28d}

.note{
 text-align:center;
 color:#d5dfff;
 padding:18px 12px 23px;
 font-size:12px;
 text-shadow:0 2px 4px #000;
}

@media(max-width:380px){
 h1{font-size:25px}
 .stat{font-size:11px}
 .stat b{font-size:18px}
 .section h2{font-size:18px}
 .upgrade{padding:9px}
 .upgrade button{padding:9px;font-size:12px}
}
</style>
</head>

<body>
<div class="game">

<header>
<h1>⚔️ EKET CLICKER ⚔️</h1>
<div>Легенда начинается здесь</div>
<button class="sound-button" id="soundButton" onclick="toggleSound()">🔇 Включить звук</button>
</header>

<div class="stats">
<div class="stat">💰 Золото<b id="gold">0</b></div>
<div class="stat">⭐ Уровень<b id="level">1</b></div>
<div class="stat">✨ Опыт<b id="xp">0 / 50</b></div>
</div>

<div class="arena" id="arena">
<img class="background" src="./forest.png" alt="Фэнтези-арена">
<div class="hero">
<img class="hero-idle" src="./eket-hero.png" alt="Герой Eket">
</div>
<img class="monster" id="monster" src="./slime.png?v=2" alt="Лесной слизень">
<div class="damage-pop" id="damagePop">-1</div>
</div>

<div class="enemy">
<b id="enemyName">Лесной слизень</b>
<div class="bar"><span id="enemyBar"></span></div>
<div id="enemyHP">30 / 30 HP</div>
</div>

<button class="attack" id="attackButton" onclick="attack()">⚔️ АТАКОВАТЬ</button>

<div class="section">
<h2>🛒 Магазин улучшений</h2>
<div class="upgrade">
<div>
<b>💥 Сильный удар</b>
<p>Урон +1 · Цена: <span id="price">25</span> золота</p>
</div>
<button onclick="upgrade()">Улучшить</button>
</div>
<p>Текущий урон: <b id="damage">1</b></p>
</div>

<div class="note">✦ Побеждай монстров и собирай золото ✦</div>
</div>

<script>
let saved={};
try{
 saved=JSON.parse(localStorage.getItem("eket-clicker-save")||"{}");
}catch(e){}

let gold=saved.gold??0;
let level=saved.level??1;
let xp=saved.xp??0;
let damage=saved.damage??1;
let price=saved.price??25;
let maxHP=saved.maxHP??30;
let hp=saved.hp??maxHP;

const CRIT_CHANCE=0.30;
const CRIT_MULTIPLIER=2;
const DODGE_CHANCE=0.10;

let isMonsterDying=false;
let attackLocked=false;
let attackTimer;

let audioContext=null;
let soundEnabled=false;
let musicTimer=null;
let musicStep=0;

function getAudio(){
 const AudioCtx=window.AudioContext||window.webkitAudioContext;
 if(!AudioCtx)return null;
 if(!audioContext)audioContext=new AudioCtx();
 if(audioContext.state==="suspended")audioContext.resume();
 return audioContext;
}

function tone(frequency,duration,type="sine",volume=0.08,slide=0){
 if(!soundEnabled)return;
 const ctx=getAudio();
 if(!ctx)return;
 const osc=ctx.createOscillator();
 const gain=ctx.createGain();
 const now=ctx.currentTime;
 osc.type=type;
 osc.frequency.setValueAtTime(frequency,now);
 if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(1,frequency+slide),now+duration);
 gain.gain.setValueAtTime(volume,now);
 gain.gain.exponentialRampToValueAtTime(0.001,now+duration);
 osc.connect(gain);
 gain.connect(ctx.destination);
 osc.start(now);
 osc.stop(now+duration);
}

function playHit(){
 tone(150,0.12,"sawtooth",0.12,-75);
 setTimeout(()=>tone(85,0.10,"triangle",0.07,-25),45);
}

function playDodge(){
 tone(520,0.16,"sine",0.07,420);
}

function playCritical(){
 tone(220,0.16,"sawtooth",0.10,260);
 setTimeout(()=>tone(440,0.22,"triangle",0.08,180),90);
}

function playVictory(){
 [392,494,587,784].forEach((f,i)=>setTimeout(()=>tone(f,0.32,"triangle",0.08),i*130));
}

function playPurchase(){
 tone(660,0.10,"sine",0.07,120);
 setTimeout(()=>tone(880,0.16,"sine",0.07,100),100);
}

const melody=[
 [392,494,587,494],
 [330,392,494,392],
 [349,440,523,440],
 [294,392,494,392]
];

function musicTick(){
 if(!soundEnabled)return;
 const phrase=melody[Math.floor(musicStep/4)%melody.length];
 const note=phrase[musicStep%4];
 tone(note,0.48,"triangle",0.025);
 if(musicStep%4===0)tone(note/2,0.75,"sine",0.018);
 musicStep++;
}

function toggleSound(){
 soundEnabled=!soundEnabled;
 const button=document.getElementById("soundButton");

 if(soundEnabled){
  getAudio();
  button.textContent="🔊 Выключить звук";
  musicTick();
  musicTimer=setInterval(musicTick,520);
 }else{
  clearInterval(musicTimer);
  musicTimer=null;
  button.textContent="🔇 Включить звук";
 }
}

function save(){
 localStorage.setItem("eket-clicker-save",JSON.stringify({
  gold,level,xp,damage,price,maxHP,hp
 }));
}

function render(){
 document.getElementById("gold").textContent=gold;
 document.getElementById("level").textContent=level;
 document.getElementById("xp").textContent=xp+" / "+(level*50);
 document.getElementById("damage").textContent=damage;
 document.getElementById("price").textContent=price;
 document.getElementById("enemyHP").textContent=hp+" / "+maxHP+" HP";
 document.getElementById("enemyBar").style.width=Math.max(0,hp/maxHP*100)+"%";
}

function resetAnimation(){
 const arena=document.getElementById("arena");
 arena.classList.remove("hit","dodge","dying");
 void arena.offsetWidth;
}

function attack(){
 if(isMonsterDying||attackLocked)return;
 attackLocked=true;

 const arena=document.getElementById("arena");
 const pop=document.getElementById("damagePop");

 resetAnimation();
 pop.className="damage-pop";

 if(Math.random()<DODGE_CHANCE){
  playDodge();
  pop.textContent="УКЛОНЕНИЕ!";
  pop.classList.add("evaded");
  arena.classList.add("dodge");

  clearTimeout(attackTimer);
  attackTimer=setTimeout(()=>{
   resetAnimation();
   attackLocked=false;
  },550);

  return;
 }

 let actualDamage=damage;
 let isCritical=false;

 if(Math.random()<CRIT_CHANCE){
  actualDamage=damage*CRIT_MULTIPLIER;
  isCritical=true;
 }

 hp-=actualDamage;

 if(isCritical){
  playCritical();
 }else{
  playHit();
 }

 pop.textContent=isCritical?"КРИТ! -"+actualDamage:"-"+actualDamage;

 if(isCritical)pop.classList.add("critical");
 arena.classList.add("hit");

 if(hp<=0){
  hp=0;
  isMonsterDying=true;
  render();
  save();

  arena.classList.add("dying");
  document.getElementById("attackButton").disabled=true;

  clearTimeout(attackTimer);
  attackTimer=setTimeout(()=>{
   playVictory();

   gold+=5+level;
   xp+=10;

   if(xp>=level*50){
    xp-=level*50;
    level++;
   }

   maxHP=Math.floor(maxHP*1.2);
   hp=maxHP;
   isMonsterDying=false;

   document.getElementById("attackButton").disabled=false;

   resetAnimation();
   render();
   save();
   attackLocked=false;
  },750);

  return;
 }

 render();
 save();

 clearTimeout(attackTimer);
 attackTimer=setTimeout(()=>{
  resetAnimation();
  attackLocked=false;
 },500);
}

function upgrade(){
 if(gold<price){
  alert("Не хватает золота!");
  return;
 }

 gold-=price;
 damage++;
 price+=25;

 playPurchase();
 save();
 render();
}

render();

document.getElementById("monster").addEventListener("error",function(){
 console.error("Не удалось загрузить slime.png");
 this.alt="Ошибка загрузки slime.png";
});
</script>
</body>
</html>

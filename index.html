
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eket Clicker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#151b20;color:#fff;font-family:Georgia,serif}
.game{max-width:600px;margin:auto;min-height:100vh;background:#211d25}
header{text-align:center;padding:16px;background:linear-gradient(#493323,#211b19);border-bottom:3px solid #c99a48}
h1{margin:0;color:#ffd477;text-shadow:0 3px #44230e;font-size:29px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px}
.stat{background:#342b27;border:1px solid #98713b;border-radius:9px;padding:9px;text-align:center;font-size:13px}
.stat b{display:block;color:#ffd477;font-size:19px;margin-top:5px}
.arena{position:relative;width:100%;aspect-ratio:1.5;overflow:hidden;background:#263c32}
.arena img{width:100%;height:100%;object-fit:cover}
.monster{position:absolute;right:12%;bottom:13%;font-size:clamp(65px,18vw,105px);filter:drop-shadow(0 5px 4px #0009);transition:.12s}
.hero{position:absolute;left:12%;bottom:12%;font-size:clamp(60px,16vw,95px);filter:drop-shadow(0 5px 4px #0009);transition:.12s}
.hit .hero{transform:translateX(35px) rotate(18deg)}
.hit .monster{transform:translateX(13px) rotate(12deg) scale(.9)}
.enemy{padding:12px;text-align:center;background:#30251f}
.enemy b{color:#ffd477}
.bar{height:15px;background:#160f10;border:1px solid #aa8450;border-radius:12px;overflow:hidden;margin-top:7px}
.bar span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#9b2525,#ef6650);transition:width .2s}
button{font-family:inherit;color:#fff;border:1px solid #d6a44f;border-radius:10px;background:linear-gradient(#805126,#49301e);padding:13px;font-size:16px;font-weight:bold}
button:active{transform:scale(.97)}
.attack{display:block;width:90%;margin:15px auto;background:linear-gradient(#b83b2e,#702018);font-size:22px;padding:17px}
.section{margin:12px;padding:14px;background:#302820;border:1px solid #8e6939;border-radius:12px}
.section h2{margin:0 0 12px;color:#ffd477;font-size:20px}
.upgrade{display:flex;align-items:center;justify-content:space-between;gap:10px}
.upgrade p{margin:4px 0;color:#d5c5a7;font-size:13px}
.upgrade button{font-size:13px;padding:10px}
.note{text-align:center;color:#c8b28d;padding:12px;font-size:12px}
</style>
</head>
<body>
<div class="game">
<header><h1>⚔️ EKET CLICKER ⚔️</h1><div>Легенда начинается здесь</div></header>

<div class="stats">
<div class="stat">💰 Золото<b id="gold">0</b></div>
<div class="stat">⭐ Уровень<b id="level">1</b></div>
<div class="stat">✨ Опыт<b id="xp">0 / 50</b></div>
</div>

<div class="arena" id="arena">
<img src="forest.png" alt="Фэнтези-арена">
<div class="hero">🛡️</div>
<div class="monster" id="monster">🟢</div>
</div>

<div class="enemy">
<b id="enemyName">Лесной слизень</b>
<div class="bar"><span id="enemyBar"></span></div>
<div id="enemyHP">30 / 30 HP</div>
</div>

<button class="attack" onclick="attack()">⚔️ АТАКОВАТЬ</button>

<div class="section">
<h2>🛒 Магазин улучшений</h2>
<div class="upgrade">
<div><b>💥 Сильный удар</b><p>Урон +1 · Цена: <span id="price">25</span> золота</p></div>
<button onclick="upgrade()">Улучшить</button>
</div>
<p>Текущий урон: <b id="damage">1</b></p>
</div>
<div class="note">Побеждай монстров и собирай золото!</div>
</div>

<script>
let saved={};
try{saved=JSON.parse(localStorage.getItem("eket-clicker-save")||"{}")}catch(e){}
let gold=saved.gold??0;
let level=saved.level??1;
let xp=saved.xp??0;
let damage=saved.damage??1;
let price=saved.price??25;
let maxHP=saved.maxHP??30;
let hp=saved.hp??maxHP;

function save(){
localStorage.setItem("eket-clicker-save",JSON.stringify({gold,level,xp,damage,price,maxHP,hp}));
}
function render(){
document.getElementById("gold").textContent=gold;
document.getElementById("level").textContent=level;
document.getElementById("xp").textContent=xp+" / "+(level*50);
document.getElementById("damage").textContent=damage;
document.getElementById("price").textContent=price;
document.getElementById("enemyHP").textContent=hp+" / "+maxHP+" HP";
document.getElementById("enemyBar").style.width=(hp/maxHP*100)+"%";
}
function attack(){
hp-=damage;
const arena=document.getElementById("arena");
arena.classList.add("hit");
setTimeout(()=>arena.classList.remove("hit"),150);
if(hp<=0){
gold+=5+level;
xp+=10;
if(xp>=level*50){
xp-=level*50;
level++;
}
maxHP=Math.floor(maxHP*1.2);
hp=maxHP;
}
save();
render();
}
function upgrade(){
if(gold<price){alert("Не хватает золота!");return}
gold-=price;
damage++;
price+=25;
save();
render();
}
render();
</script>
</body>
</html>

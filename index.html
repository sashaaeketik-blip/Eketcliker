
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#171b20">
<title>Eket Clicker</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:#171b20;
  color:white;
  font-family:Arial,sans-serif;
  user-select:none;
}
.game { max-width:600px; margin:auto; padding:15px; }
header {
  display:flex; justify-content:space-between;
  align-items:center; margin-bottom:14px;
}
h1 { margin:0; color:#f6d58b; font-size:25px; }
.gold {
  background:#332b20; padding:10px 14px;
  border-radius:14px; color:#ffda72; font-weight:bold;
}
.stats {
  display:flex; gap:10px; margin-bottom:12px;
}
.stat {
  flex:1; background:#292d35; padding:12px;
  border-radius:12px; font-size:13px;
}
.bar {
  height:11px; background:#444;
  border-radius:20px; overflow:hidden; margin-top:7px;
}
.fill { height:100%; width:100%; transition:width .2s; }
.hp { background:#e64d52; }
.xp { background:#5c9df2; }
.arena {
  position:relative; height:330px; overflow:hidden;
  border-radius:20px;
  background:
    radial-gradient(ellipse at 50% 85%,#b6a36b 0%,transparent 55%),
    linear-gradient(#73b6dc 0%,#a5d5d9 35%,#56854a 36%,#294d32 100%);
  border:3px solid #665039;
}
.sun {
  position:absolute; top:25px; right:45px;
  font-size:40px; opacity:.9;
}
.tree {
  position:absolute; font-size:65px;
  top:65px;
}
.tree.left { left:5px; }
.tree.right { right:5px; }
.castle {
  position:absolute; top:30px; left:50%;
  transform:translateX(-50%); font-size:55px;
}
.ground {
  position:absolute; bottom:0; height:75px;
  width:100%; background:#826c48;
  border-top:5px solid #a4a05b;
}
.character {
  position:absolute; bottom:53px; left:17%;
  font-size:76px; z-index:2;
  transition:transform .12s;
}
.monster {
  position:absolute; bottom:58px; right:17%;
  font-size:82px; z-index:2;
  transition:transform .12s,opacity .2s;
  filter:drop-shadow(0 5px 4px #263b25);
}
.monster.hit { transform:translateX(12px) rotate(12deg); }
.monster.dead { opacity:0; transform:scale(.3); }
.damage {
  position:absolute; z-index:5;
  font-size:27px; font-weight:bold;
  color:#ff5252; text-shadow:2px 2px #222;
  animation:float .7s forwards;
  pointer-events:none;
}
@keyframes float {
  from { transform:translateY(0);opacity:1; }
  to { transform:translateY(-75px);opacity:0; }
}
.monster-info {
  text-align:center; margin:15px 0 8px;
}
.monster-info b { font-size:19px; }
.monster-info .bar { max-width:350px; margin:8px auto; }
.battle-info {
  display:flex; justify-content:space-between;
  color:#c7c7c7; font-size:13px;
}
button {
  border:0; border-radius:14px; padding:15px;
  color:white; font-weight:bold; font-size:16px;
  cursor:pointer;
}
.attack {
  width:100%; margin-top:15px;
  background:linear-gradient(135deg,#a65c35,#d18b40);
  box-shadow:0 4px #683b25;
  font-size:19px;
}
.attack:active { transform:translateY(3px); box-shadow:none; }
.shop {
  background:#292d35; border-radius:16px;
  padding:15px; margin-top:20px;
}
.shop h2 { margin:0 0 12px; font-size:19px; }
.upgrade {
  display:flex; align-items:center;
  justify-content:space-between; gap:8px;
  border-top:1px solid #444;
  padding:12px 0;
}
.upgrade small { color:#aaa; display:block; margin-top:4px; }
.buy { background:#7251a4; padding:11px; font-size:13px; }
.buy:disabled { background:#49434f; opacity:.6; }
.message {
  text-align:center; color:#f6d58b;
  min-height:22px; margin-top:12px; font-size:14px;
}
.reset {
  background:#393c42; margin-top:18px;
  width:100%; font-size:12px;
}
</style>
</head>
<body>
<div class="game">
<header>
  <h1>👑 Eket Clicker</h1>
  <div class="gold">🪙 <span id="gold">0</span></div>
</header>

<div class="stats">
  <div class="stat">
    ❤️ Здоровье героя
    <div><b id="heroHP">100 / 100</b></div>
    <div class="bar"><div class="fill hp" id="heroBar"></div></div>
  </div>
  <div class="stat">
    ⭐ Уровень <b id="level">1</b>
    <div><b id="xpText">0 / 30 XP</b></div>
    <div class="bar"><div class="fill xp" id="xpBar"></div></div>
  </div>
</div>

<div class="arena" id="arena">
  <div class="sun">☀️</div>
  <div class="castle">🏰</div>
  <div class="tree left">🌳</div>
  <div class="tree right">🌲</div>
  <div class="ground"></div>
  <div class="character" id="hero">🧙</div>
  <div class="monster" id="monster">🟢</div>
</div>

<div class="monster-info">
  <b id="monsterName">Лесной слизень</b>
  <div class="bar"><div class="fill hp" id="monsterBar"></div></div>
  <div class="battle-info">
    <span id="monsterHP">30 / 30 HP</span>
    <span>⚔️ Урон: <b id="damageStat">1</b></span>
  </div>
</div>

<button class="attack" onclick="attack()">⚔️ АТАКОВАТЬ</button>
<div class="message" id="message">Побеждай монстров и собирай золото!</div>

<div class="shop">
  <h2>🏪 Магазин улучшений</h2>
  <div class="upgrade">
    <div>
      <b>⚔️ Сильный удар</b>
      <small>Увеличивает урон на 1</small>
      <small>Уровень: <span id="powerLevel">0</span></small>
    </div>
    <button class="buy" id="powerBuy" onclick="buyPower()">🪙 25</button>
  </div>
</div>

<button class="reset" onclick="resetGame()">Начать заново</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem("eketClicker") || "null") || {
 gold:0, level:1, xp:0, damage:1, powerLevel:0,
 heroHP:100, monsterHP:30, monsterMax:30, kills:0
};

function save() {
 localStorage.setItem("eketClicker",JSON.stringify(data));
}

function render() {
 document.getElementById("gold").textContent=data.gold;
 document.getElementById("level").textContent=data.level;
 document.getElementById("heroHP").textContent=data.heroHP+" / 100";
 document.getElementById("heroBar").style.width=data.heroHP+"%";
 document.getElementById("xpText").textContent=data.xp+" / "+(data.level*30)+" XP";
 document.getElementById("xpBar").style.width=(data.xp/(data.level*30)*100)+"%";
 document.getElementById("monsterHP").textContent=data.monsterHP+" / "+data.monsterMax+" HP";
 document.getElementById("monsterBar").style.width=(data.monsterHP/data.monsterMax*100)+"%";
 document.getElementById("damageStat").textContent=data.damage;
 document.getElementById("powerLevel").textContent=data.powerLevel;
 document.getElementById("powerBuy").textContent="🪙 "+(25+data.powerLevel*25);
 document.getElementById("powerBuy").disabled=data.gold<25+data.powerLevel*25;
}

function attack() {
 if(data.monsterHP<=0) return;
 data.monsterHP-=data.damage;
 const monster=document.getElementById("monster");
 monster.classList.remove("hit");
 void monster.offsetWidth;
 monster.classList.add("hit");
 setTimeout(()=>monster.classList.remove("hit"),150);

 const arena=document.getElementById("arena");
 const number=document.createElement("div");
 number.className="damage";
 number.textContent="-"+data.damage;
 number.style.left="70%";
 number.style.top="42%";
 arena.appendChild(number);
 setTimeout(()=>number.remove(),700);

 if(data.monsterHP<=0) {
   data.monsterHP=0;
   data.gold+=5;
   data.xp+=10;
   data.kills++;
   document.getElementById("monster").classList.add("dead");
   document.getElementById("message").textContent="🏆 Победа! +5 золота и +10 опыта!";
   if(data.xp>=data.level*30) {
     data.xp-=data.level*30;
     data.level++;
     data.heroHP=100;
     document.getElementById("message").textContent="⭐ Новый уровень! Уровень "+data.level;
   }
   setTimeout(respawn,1000);
 } else {
   document.getElementById("message").textContent="Отличный удар! Продолжай!";
 }
 save();
 render();
}

function respawn() {
 data.monsterMax=30+(data.kills*10);
 data.monsterHP=data.monsterMax;
 document.getElementById("monster").classList.remove("dead");
 document.getElementById("message").textContent="Новый монстр появился!";
 save();
 render();
}

function buyPower() {
 const cost=25+data.powerLevel*25;
 if(data.gold<cost) return;
 data.gold-=cost;
 data.damage++;
 data.powerLevel++;
 document.getElementById("message").textContent="⚔️ Твой удар стал сильнее!";
 save();
 render();
}

function resetGame() {
 if(!confirm("Удалить весь прогресс и начать заново?")) return;
 localStorage.removeItem("eketClicker");
 location.reload();
}

render();
</script>
</body>
</html>

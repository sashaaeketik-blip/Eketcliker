
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b19">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eket Clicker">

<title>Eket Clicker</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#0b1211;
 color:#e5eee9;
 font-family:Georgia,serif;
}

body{
 min-height:100dvh;
}

.game{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 height:100dvh;
 overflow:hidden;
 background:#101b19;
}

.arena{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#17251e;
}

.arena>img.background{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 object-position:center;
 display:block;
 z-index:0;
 filter:brightness(.76) saturate(.82);
}

.arena:after{
 content:"";
 position:absolute;
 inset:0;
 z-index:2;
 pointer-events:none;
 background:
 linear-gradient(180deg,#07100b99 0%,transparent 28%),
 linear-gradient(0deg,#07100be8 0%,transparent 42%);
}

header{
 position:absolute;
 z-index:10;
 top:env(safe-area-inset-top,0px);
 left:0;
 right:0;
 padding:13px 65px 8px;
 text-align:center;
 pointer-events:none;
}

h1{
 margin:0;
 color:#e0eadf;
 font-size:22px;
 letter-spacing:4px;
 font-weight:normal;
 text-shadow:0 2px 8px #000;
}

.subtitle{
 margin-top:4px;
 color:#bdcbbb;
 font-size:11px;
 letter-spacing:2px;
 text-shadow:0 2px 6px #000;
}

.sound-button{
 position:absolute;
 right:15px;
 top:10px;
 width:40px;
 height:40px;
 border:1px solid #ffffff35;
 border-radius:50%;
 background:#101c18bb;
 color:#e0eadf;
 font-size:19px;
 padding:0;
 pointer-events:auto;
 backdrop-filter:blur(8px);
}

.stats{
 position:absolute;
 z-index:10;
 top:calc(env(safe-area-inset-top,0px) + 75px);
 left:12px;
 right:12px;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
}

.stat{
 text-align:center;
 padding:8px 4px;
 border:1px solid #ffffff22;
 border-radius:9px;
 background:#101b19b8;
 color:#a9bcae;
 font-size:9px;
 letter-spacing:1px;
 backdrop-filter:blur(8px);
 box-shadow:0 4px 12px #0003;
}

.stat b{
 display:block;
 margin-top:4px;
 color:#edf3e9;
 font-size:18px;
 font-weight:normal;
}

.hero{
 position:absolute;
 left:5%;
 bottom:17%;
 width:43%;
 height:53%;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 z-index:3;
 pointer-events:none;
}

.hero-idle{
 width:100%;
 height:100%;
 object-fit:contain;
 object-position:center bottom;
 filter:drop-shadow(0 8px 8px #000b);
 transform-origin:bottom center;
}

.monster{
 position:absolute;
 right:5%;
 bottom:17%;
 width:34%;
 height:35%;
 object-fit:contain;
 object-position:center bottom;
 display:block;
 z-index:4;
 cursor:pointer;
 filter:drop-shadow(0 8px 7px #000b);
 transform-origin:center bottom;
}

.arena.hit .hero-idle,
.arena.dodge .hero-idle{
 animation:heroAttack .45s ease-in-out;
}

@keyframes heroAttack{
 0%{transform:translateX(0) rotate(0) scale(1)}
 40%{transform:translateX(35px) rotate(-8deg) scale(1.08)}
 70%{transform:translateX(25px) rotate(5deg) scale(1.04)}
 100%{transform:translateX(0) rotate(0) scale(1)}
}

.arena.hit .monster{
 animation:monsterKnockback .42s ease-out;
}

@keyframes monsterKnockback{
 0%{transform:translateX(0) rotate(0) scale(1)}
 25%{transform:translateX(35px) rotate(18deg) scale(.82)}
 55%{transform:translateX(20px) rotate(-12deg) scale(.9)}
 100%{transform:translateX(0) rotate(0) scale(1)}
}

.arena.dodge .monster{
 animation:monsterDodge .48s ease-in-out;
}

@keyframes monsterDodge{
 0%{transform:translateX(0) rotate(0)}
 35%{transform:translateX(-45px) rotate(-18deg) scale(.85)}
 65%{transform:translateX(-30px) rotate(12deg)}
 100%{transform:translateX(0) rotate(0) scale(1)}
}

.arena.dying .monster{
 animation:monsterDeath .7s ease-in forwards!important;
}

@keyframes monsterDeath{
 0%{opacity:1;transform:translateY(0) rotate(0) scale(1)}
 35%{opacity:1;transform:translateY(-55px) rotate(35deg) scale(1.15)}
 100%{opacity:0;transform:translateY(35px) rotate(180deg) scale(.05)}
}

/* Урон над противником */

.damage-pop{
 position:absolute;
 right:15%;
 bottom:47%;
 z-index:8;
 color:#e5e8bd;
 font:bold 25px Georgia,serif;
 text-shadow:0 2px 8px #000;
 opacity:0;
 pointer-events:none;
 white-space:nowrap;
}

.arena.hit .damage-pop{
 animation:damagePop .55s ease-out;
}

@keyframes damagePop{
 0%{opacity:0;transform:translateY(15px) scale(.7)}
 25%{opacity:1}
 100%{opacity:0;transform:translateY(-40px) scale(1.2)}
}

.damage-pop.critical{
 color:#f4d18a;
 font-size:32px;
 text-shadow:0 0 12px #b76d32,0 2px 6px #000;
}

.arena.hit .damage-pop.critical{
 animation:criticalPop .8s ease-out;
}

@keyframes criticalPop{
 0%{opacity:0;transform:translateY(20px) scale(.3) rotate(-10deg)}
 25%{opacity:1;transform:translateY(-5px) scale(1.35) rotate(5deg)}
 45%{transform:translateY(-12px) scale(1.1)}
 100%{opacity:0;transform:translateY(-65px) scale(1.4)}
}

.damage-pop.evaded{
 color:#b4d8d4;
 font-size:20px;
 text-shadow:0 0 8px #397e78,0 2px 5px #000;
}

.arena.dodge .damage-pop{
 animation:dodgePop .65s ease-out;
}

@keyframes dodgePop{
 0%{opacity:0;transform:translateY(10px) scale(.6)}
 25%{opacity:1;transform:translateY(-5px) scale(1.15)}
 100%{opacity:0;transform:translateY(-45px) scale(1)}
}

/* НОВЫЙ HP-БАР НАД СЛИЗНЕМ */

.enemy{
 position:absolute;
 z-index:7;

 right:4%;
 bottom:calc(17% + 35% + 8px);

 width:38%;
 max-width:210px;

 padding:7px 10px 6px;

 text-align:center;

 border:1px solid #d8e5d044;
 border-radius:9px;

 background:linear-gradient(
  145deg,
  rgba(15,29,24,.94),
  rgba(9,17,15,.88)
 );

 backdrop-filter:blur(8px);

 box-shadow:
 0 4px 12px #0008,
 inset 0 1px 0 #ffffff15;
}

.enemy b{
 display:block;
 color:#e8eee3;
 font-size:11px;
 font-weight:normal;
 letter-spacing:.4px;
 text-shadow:0 2px 5px #000;
 white-space:nowrap;
}

.bar{
 height:7px;
 background:#202e28;
 border:1px solid #ffffff18;
 border-radius:10px;
 overflow:hidden;
 margin-top:6px;
 box-shadow:inset 0 1px 3px #0009;
}

.bar span{
 display:block;
 height:100%;
 width:100%;
 border-radius:10px;

 background:linear-gradient(
  90deg,
  #853f38,
  #c65e4e,
  #e18c69
 );

 box-shadow:0 0 8px #d66c5266;

 transition:width .25s ease;
}

#enemyHP{
 margin-top:4px;
 color:#bdcabe;
 font-size:9px;
 letter-spacing:.3px;
}

/* Подсказка */

.note{
 position:absolute;
 z-index:8;
 left:0;
 right:0;
 bottom:calc(env(safe-area-inset-bottom,0px) + 35px);
 text-align:center;
 color:#d0dfd0;
 font-size:11px;
 text-shadow:0 2px 6px #000;
 pointer-events:none;
}

/* Адаптация */

@media(max-height:650px){

 header{padding-top:7px}

 h1{font-size:19px}

 .stats{
  top:calc(env(safe-area-inset-top,0px) + 58px);
 }

 .hero{
  height:47%;
  bottom:20%;
 }

 .monster{
  height:31%;
  bottom:20%;
 }

 .enemy{
  bottom:calc(20% + 31% + 7px);
 }

}

@media(max-width:380px){
 .enemy{
  width:40%;
  right:3%;
 }

 .enemy b{
  font-size:10px;
 }
}

@media(min-width:700px){
 .game{
  max-width:600px;
  left:50%;
  transform:translateX(-50%);
 }
}

</style>
</head>

<body>

<div class="game">

<div class="arena" id="arena">

<img class="background" src="./forest.png" alt="Лес">

<header>
<h1>EKET CLICKER</h1>
<div class="subtitle">Лесные земли</div>
<button class="sound-button" id="soundButton" onclick="toggleSound()">♪</button>
</header>

<div class="stats">
 <div class="stat">ЗОЛОТО<b id="gold">0</b></div>
 <div class="stat">УРОВЕНЬ<b id="level">1</b></div>
 <div class="stat">ОПЫТ<b id="xp">0 / 50</b></div>
</div>

<div class="hero">
<img class="hero-idle" src="./eket-hero.png" alt="Герой Eket">
</div>

<img class="monster" id="monster" src="./slime.png?v=2" alt="Лесной слизень">

<div class="damage-pop" id="damagePop">-1</div>

<!-- HP слизня теперь расположен над ним -->

<div class="enemy">
 <b id="enemyName">Лесной слизень</b>
 <div class="bar">
  <span id="enemyBar"></span>
 </div>
 <div id="enemyHP">30 / 30 HP</div>
</div>

<div class="note">Нажимай на противника, чтобы атаковать</div>

</div>
</div>

<script>

let saved={};

try{
 saved=JSON.parse(localStorage.getItem("eket-clicker-save")||"{}");
}catch(e){}

let gold=saved.gold??0;
let level=saved.level??1;
let xp=saved.xp??0;
let damage=saved.damage??1;
let price=saved.price??25;
let maxHP=saved.maxHP??30;
let hp=saved.hp??maxHP;

const CRIT_CHANCE=0.30;
const CRIT_MULTIPLIER=2;
const DODGE_CHANCE=0.10;

let isMonsterDying=false;
let attackLocked=false;
let attackTimer;

let audioContext=null;
let soundEnabled=false;
let musicTimer=null;
let musicStep=0;

function getAudio(){
 const AudioCtx=window.AudioContext||window.webkitAudioContext;
 if(!AudioCtx)return null;

 if(!audioContext)audioContext=new AudioCtx();

 if(audioContext.state==="suspended")audioContext.resume();

 return audioContext;
}

function tone(frequency,duration,type="sine",volume=0.08,slide=0){

 if(!soundEnabled)return;

 const ctx=getAudio();
 if(!ctx)return;

 const osc=ctx.createOscillator();
 const gain=ctx.createGain();
 const now=ctx.currentTime;

 osc.type=type;
 osc.frequency.setValueAtTime(frequency,now);

 if(slide){
  osc.frequency.exponentialRampToValueAtTime(
   Math.max(1,frequency+slide),now+duration
  );
 }

 gain.gain.setValueAtTime(volume,now);
 gain.gain.exponentialRampToValueAtTime(0.001,now+duration);

 osc.connect(gain);
 gain.connect(ctx.destination);

 osc.start(now);
 osc.stop(now+duration);
}

function playHit(){
 tone(150,0.12,"sawtooth",0.12,-75);
 setTimeout(()=>tone(85,0.10,"triangle",0.07,-25),45);
}

function playDodge(){
 tone(520,0.16,"sine",0.07,420);
}

function playCritical(){
 tone(220,0.16,"sawtooth",0.10,260);
 setTimeout(()=>tone(440,0.22,"triangle",0.08,180),90);
}

function playVictory(){
 [392,494,587,784].forEach((f,i)=>{
  setTimeout(()=>tone(f,0.32,"triangle",0.08),i*130);
 });
}

function toggleSound(){

 soundEnabled=!soundEnabled;

 const button=document.getElementById("soundButton");

 if(soundEnabled){

  getAudio();

  button.textContent="♫";

  musicTick();

  musicTimer=setInterval(musicTick,520);

 }else{

  clearInterval(musicTimer);

  musicTimer=null;

  button.textContent="♪";
 }
}

const melody=[
 [392,494,587,494],
 [330,392,494,392],
 [349,440,523,440],
 [294,392,494,392]
];

function musicTick(){

 if(!soundEnabled)return;

 const phrase=melody[Math.floor(musicStep/4)%melody.length];
 const note=phrase[musicStep%4];

 tone(note,0.48,"triangle",0.025);

 if(musicStep%4===0){
  tone(note/2,0.75,"sine",0.018);
 }

 musicStep++;
}

function save(){

 localStorage.setItem("eket-clicker-save",JSON.stringify({
  gold,
  level,
  xp,
  damage,
  price,
  maxHP,
  hp
 }));

}

function render(){

 document.getElementById("gold").textContent=gold;

 document.getElementById("level").textContent=level;

 document.getElementById("xp").textContent=
  xp+" / "+(level*50);

 document.getElementById("enemyHP").textContent=
  hp+" / "+maxHP+" HP";

 document.getElementById("enemyBar").style.width=
  Math.max(0,hp/maxHP*100)+"%";

}

function resetAnimation(){

 const arena=document.getElementById("arena");

 arena.classList.remove("hit","dodge","dying");

 void arena.offsetWidth;

}

function attack(){

 if(isMonsterDying||attackLocked)return;

 attackLocked=true;

 const arena=document.getElementById("arena");
 const pop=document.getElementById("damagePop");

 resetAnimation();

 pop.className="damage-pop";

 if(Math.random()<DODGE_CHANCE){

  playDodge();

  pop.textContent="УКЛОНЕНИЕ!";
  pop.classList.add("evaded");

  arena.classList.add("dodge");

  clearTimeout(attackTimer);

  attackTimer=setTimeout(()=>{

   resetAnimation();

   attackLocked=false;

  },550);

  return;
 }

 let actualDamage=damage;
 let isCritical=false;

 if(Math.random()<CRIT_CHANCE){

  actualDamage=damage*CRIT_MULTIPLIER;

  isCritical=true;
 }

 hp-=actualDamage;

 if(isCritical){
  playCritical();
 }else{
  playHit();
 }

 pop.textContent=isCritical?
  "КРИТ! -"+actualDamage:
  "-"+actualDamage;

 if(isCritical){
  pop.classList.add("critical");
 }

 arena.classList.add("hit");

 if(hp<=0){

  hp=0;

  isMonsterDying=true;

  render();
  save();

  arena.classList.add("dying");

  clearTimeout(attackTimer);

  attackTimer=setTimeout(()=>{

   playVictory();

   gold+=5+level;

   xp+=10;

   if(xp>=level*50){

    xp-=level*50;

    level++;
   }

   maxHP=Math.floor(maxHP*1.2);

   hp=maxHP;

   isMonsterDying=false;

   resetAnimation();

   render();

   save();

   attackLocked=false;

  },750);

  return;
 }

 render();

 save();

 clearTimeout(attackTimer);

 attackTimer=setTimeout(()=>{

  resetAnimation();

  attackLocked=false;

 },500);

}

document.getElementById("monster").addEventListener("click",attack);

render();

document.getElementById("monster").addEventListener("error",function(){

 console.error("Не удалось загрузить slime.png");

 this.alt="Ошибка загрузки slime.png";

});

</script>

</body>
</html>

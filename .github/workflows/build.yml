
name: Eket Clicker Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare game files
        run: |
          mkdir -p www
          cp index.html www/
          cp *.png www/ || true

      - name: Sync Capacitor
        run: npx cap sync

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: eket-clicker-mobile
          path: www/


name: Eket Clicker Mobile Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare game
        run: |
          mkdir -p www
          cp index.html www/
          cp *.png www/ || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Generate app icons
        run: |
          python3 -m pip install Pillow

          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          source = Image.open("Eket-Clicker-App-Store-1024.png").convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          res = Path("android/app/src/main/res")

          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          for density, size in {
              "mdpi": 108,
              "hdpi": 162,
              "xhdpi": 216,
              "xxhdpi": 324,
              "xxxhdpi": 432
          }.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              art_size = int(size * 0.68)
              art = source.resize((art_size, art_size), Image.Resampling.LANCZOS)

              mask = Image.new("L", (art_size, art_size), 0)
              draw = ImageDraw.Draw(mask)
              draw.rounded_rectangle(
                  (0, 0, art_size - 1, art_size - 1),
                  radius=int(art_size * 0.20),
                  fill=255
              )
              art.putalpha(mask)

              position = ((size - art_size) // 2, (size - art_size) // 2)
              canvas.alpha_composite(art, position)
              canvas.save(folder / "ic_launcher_foreground.png")

          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)

          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''

          (adaptive / "ic_launcher.xml").write_text(xml)
          (adaptive / "ic_launcher_round.xml").write_text(xml)

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)

          color_file = values / "ic_launcher_background.xml"
          color_file.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#123A74</color>
          </resources>
          ''')

          print("App icons generated successfully")
          PY

      - name: Enable fullscreen mode
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java -print -quit)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          PACKAGE_LINE=$(grep -m1 '^package ' "$MAIN_ACTIVITY")

          printf '%s\n\n' "$PACKAGE_LINE" > "$MAIN_ACTIVITY"

          cat >> "$MAIN_ACTIVITY" <<'EOF'
          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemUI();
              }

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  );
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eket-Clicker-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

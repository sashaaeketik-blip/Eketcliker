<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Eket Clicker — 3D Village</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a18;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;padding:9px 13px;border:1px solid #ffffff30;border-radius:12px;background:#14251dcc;font-size:13px;backdrop-filter:blur(8px)}#status{opacity:.8;font-size:11px;margin-top:3px}.hint{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;padding:8px 11px;background:#14251dcc;border:1px solid #ffffff30;border-radius:10px;font-size:11px}.stick{pointer-events:auto;position:absolute;left:22px;bottom:calc(24px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:#dce9df22;border:2px solid #ffffff55;box-shadow:inset 0 0 24px #0005;touch-action:none}.knob{position:absolute;width:55px;height:55px;left:36px;top:36px;border-radius:50%;background:linear-gradient(145deg,#d9c18c,#8b7047);border:2px solid #fff9;box-shadow:0 4px 12px #0008}.help{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));right:14px;max-width:145px;text-align:right;font-size:11px;line-height:1.5;color:#fffC;text-shadow:0 2px 4px #000}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#08110fe8;padding:24px;text-align:center}.panel{max-width:420px;padding:22px;border:1px solid #ffffff30;border-radius:18px;background:#1a2c27}.panel h2{margin:0 0 8px}.panel p{font-size:14px;line-height:1.5;color:#d4dfd8}.panel button{padding:11px 18px;border:0;border-radius:10px;background:#c9a66b;color:#1b1b16;font-weight:700}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="top"><b>EKETORIA · ДЕРЕВНЯ</b><div id="status">Подготовка 3D-мира…</div></div><div class="hint">3D · тестовая версия</div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="help">Двигай джойстик<br>ПК: WASD / стрелки</div></div>
<div class="overlay" id="error"><div class="panel"><h2>3D-графика недоступна</h2><p id="errtext">Браузер не смог создать WebGL-контекст. Попробуй открыть страницу в Safari и проверить, включено ли аппаратное ускорение.</p><button onclick="location.reload()">Повторить запуск</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),status=document.getElementById('status'),error=document.getElementById('error');
let gl=canvas.getContext('webgl',{alpha:false,antialias:true,powerPreference:'high-performance'})||canvas.getContext('experimental-webgl');
if(!gl){status.textContent='Не удалось создать WebGL';error.style.display='flex';return;}
const vs=`attribute vec3 p; attribute vec3 n; uniform mat4 mvp; uniform mat4 model; varying float light; void main(){vec3 nn=normalize(mat3(model)*n); light=0.48+0.52*max(dot(nn,normalize(vec3(-0.4,0.9,0.35))),0.0); gl_Position=mvp*vec4(p,1.0);}`;
const fs=`precision mediump float; uniform vec3 color; varying float light; void main(){gl_FragColor=vec4(color*light,1.0);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
let prog;try{prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));}catch(e){status.textContent='Ошибка 3D: '+e.message;error.style.display='flex';return;}
gl.useProgram(prog);const P=gl.getAttribLocation(prog,'p'),N=gl.getAttribLocation(prog,'n'),MVP=gl.getUniformLocation(prog,'mvp'),MODEL=gl.getUniformLocation(prog,'model'),COLOR=gl.getUniformLocation(prog,'color');
// Unit cube, with face normals
const verts=[];function face(a,b,c,d,n){for(const v of [a,b,c,a,c,d])verts.push(...v,...n)}
face([-0.5,-0.5,0.5],[0.5,-0.5,0.5],[0.5,0.5,0.5],[-0.5,0.5,0.5],[0,0,1]);face([0.5,-0.5,-0.5],[-0.5,-0.5,-0.5],[-0.5,0.5,-0.5],[0.5,0.5,-0.5],[0,0,-1]);face([-0.5,-0.5,-0.5],[-0.5,-0.5,0.5],[-0.5,0.5,0.5],[-0.5,0.5,-0.5],[-1,0,0]);face([0.5,-0.5,0.5],[0.5,-0.5,-0.5],[0.5,0.5,-0.5],[0.5,0.5,0.5],[1,0,0]);face([-0.5,0.5,0.5],[0.5,0.5,0.5],[0.5,0.5,-0.5],[-0.5,0.5,-0.5],[0,1,0]);face([-0.5,-0.5,-0.5],[0.5,-0.5,-0.5],[0.5,-0.5,0.5],[-0.5,-0.5,0.5],[0,-1,0]);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);gl.enableVertexAttribArray(P);gl.vertexAttribPointer(P,3,gl.FLOAT,false,24,0);gl.enableVertexAttribArray(N);gl.vertexAttribPointer(N,3,gl.FLOAT,false,24,12);
gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.clearColor(.48,.68,.77,1);
function matMul(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function perspective(fovy,aspect,near,far){let f=1/Math.tan(fovy/2),nf=1/(near-far),o=new Float32Array(16);o[0]=f/aspect;o[5]=f;o[10]=(far+near)*nf;o[11]=-1;o[14]=2*far*near*nf;return o}
function lookAt(eye,center,up){let z=norm(sub(eye,center)),x=norm(cross(up,z)),y=cross(z,x),o=new Float32Array(16);o[0]=x[0];o[1]=y[0];o[2]=z[0];o[4]=x[1];o[5]=y[1];o[6]=z[1];o[8]=x[2];o[9]=y[2];o[10]=z[2];o[12]=-dot(x,eye);o[13]=-dot(y,eye);o[14]=-dot(z,eye);o[15]=1;return o}
const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{let l=Math.hypot(...a)||1;return a.map(v=>v/l)};
function model(x,y,z,sx,sy,sz,ry=0){let c=Math.cos(ry),s=Math.sin(ry);return new Float32Array([c*sx,0,-s*sx,0,0,sy,0,0,s*sz,0,c*sz,0,x,y,z,1]);}
function draw(x,y,z,sx,sy,sz,col,ry=0){let m=model(x,y,z,sx,sy,sz,ry);gl.uniformMatrix4fv(MODEL,false,m);gl.uniformMatrix4fv(MVP,false,matMul(vp,m));gl.uniform3fv(COLOR,col);gl.drawArrays(gl.TRIANGLES,0,36)}
const C={grass:[.24,.39,.22],grass2:[.31,.47,.25],road:[.42,.34,.25],stone:[.48,.48,.43],wood:[.34,.19,.10],wood2:[.48,.29,.15],roof:[.25,.12,.10],roof2:[.38,.19,.12],cream:[.69,.58,.40],dark:[.12,.10,.08],leaf:[.13,.31,.16],leaf2:[.22,.39,.19],water:[.17,.39,.53],metal:[.29,.31,.31],skin:[.76,.55,.37],cloth:[.16,.27,.42],gold:[.72,.52,.2]};
let px=0,pz=4,heading=0,vp;const houses=[[-8,-7,4.2,3.3,4],[-2,-10,4.4,3.4,4.2],[7,-7,4.6,3.4,4.4],[10,1,4,3.2,3.8],[-10,3,4.3,3.3,4.1],[-7,11,4.5,3.4,4],[5,11,4.3,3.2,4]];
function house(x,z,w,h,d,variant=0){draw(x,h/2,z,w,h,d,variant?C.cream:C.wood2);draw(x,h+.65,z,w*1.12,1.3,d*1.12,variant?C.wood2:C.wood);draw(x,h+1.35,z,w*1.2,.22,d*1.2,C.roof);draw(x,h+1.9,z,w*1.05,.95,d*.68,C.roof2,.55);draw(x,h+1.9,z,w*1.05,.95,d*.68,C.roof2,-.55);draw(x,h*.48,z+d/2+.03,.8,1.5,.12,C.dark);draw(x-w*.27,h*.67,z+d/2+.04,.65,.6,.1,C.water);draw(x+w*.27,h*.67,z+d/2+.04,.65,.6,.1,C.water);}
function tree(x,z,k=1){draw(x,.7*k,z,.42*k,1.4*k,.42*k,C.wood);draw(x,2*k,z,2.1*k,2.2*k,2.1*k,C.leaf);draw(x-.35*k,2.8*k,z+.15*k,1.45*k,1.5*k,1.45*k,C.leaf2);}
function world(){draw(0,-.35,0,70,.5,70,C.grass);draw(0,-.08,0,5,.12,48,C.road);draw(0,-.07,0,42,.12,4.2,C.road);draw(0,-.005,0,9,.08,9,C.stone);
// well
 draw(0,.35,0,1.8,.7,1.8,C.stone);draw(0,.8,0,1.25,.2,1.25,C.dark);draw(0,1.8,0,.18,2,.18,C.wood);draw(0,2.5,0,2.5,.18,.18,C.wood);draw(0,2.15,0,1.5,.12,1.5,C.roof);
 houses.forEach((h,i)=>house(...h,i%2));
 // blacksmith forge chimney and anvil
 draw(-3,1.3,6,2.8,2.6,2.5,C.wood);draw(-3,3,6,1.2,1.2,1.2,C.roof);draw(-4.2,3.2,5.3,.55,2.4,.55,C.stone);draw(-1.9,.45,4.5,1.1,.5,.7,C.metal);
 // trees and shrubs
 [[-16,-14],[-12,-17],[-5,-18],[4,-17],[13,-14],[17,-7],[17,7],[14,17],[-15,15],[-18,7],[-18,-3],[3,17]].forEach((p,i)=>tree(p[0],p[1],.8+(i%3)*.14));
 // fence fragments
 for(let i=0;i<8;i++){draw(-14+i*.7,.55,5,.12,1.1,.12,C.wood);draw(-14+i*.7,.85,5,.16,.12,.16,C.wood)}
}
function player(){// stylized placeholder adventurer
 draw(px,.65,pz,.72,1.25,.48,C.cloth,heading);draw(px,1.52,pz,.55,.55,.55,C.skin);draw(px,1.83,pz,.62,.22,.62,C.gold);draw(px+.48*Math.sin(heading),.72,pz+.48*Math.cos(heading),.16,.9,.16,C.metal,heading+.3);}
function resize(){let d=Math.min(devicePixelRatio||1,1.5),w=Math.floor(innerWidth*d),h=Math.floor(innerHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}
let keys={},joyX=0,joyY=0;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let active=false;function joy(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=43,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}joyX=dx/max;joyY=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);joy(e)});stick.addEventListener('pointermove',e=>{if(active)joy(e)});function endJoy(){active=false;joyX=joyY=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',endJoy);stick.addEventListener('pointercancel',endJoy);
let last=0;function frame(t){resize();let dt=Math.min((t-last)/1000||0,.04);last=t;let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX,y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joyY;let l=Math.hypot(x,y);if(l>.12){x/=Math.max(1,l);y/=Math.max(1,l);px+=x*5*dt;pz+=y*5*dt;heading=Math.atan2(x,y)}px=Math.max(-20,Math.min(20,px));pz=Math.max(-20,Math.min(20,pz));gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let aspect=canvas.width/canvas.height;let proj=perspective(Math.PI/3,aspect,.1,120);let eye=[px,9,pz+13],target=[px,0.7,pz-1.5];vp=matMul(proj,lookAt(eye,target,[0,1,0]));world();player();status.textContent='Мир загружен · WebGL работает';requestAnimationFrame(frame)}
status.textContent='3D-мир запущен';requestAnimationFrame(frame);
})();
</script></body></html>

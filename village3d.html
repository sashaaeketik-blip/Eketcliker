 const r=.38;
 for(const b of solidRects){const qx=Math.max(b.minX,Math.min(x,b.maxX)),qz=Math.max(b.minZ,Math.min(z,b.maxZ));if((x-qx)*(x-qx)+(z-qz)*(z-qz)<r*r)return true;}

}

const stick=document.getElementById('stick'),knob=document.getElementById('knob');let active=false;function joy(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=43,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}joyX=dx/max;joyY=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);joy(e)});stick.addEventListener('pointermove',e=>{if(active)joy(e)});function endJoy(){active=false;joyX=joyY=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',endJoy);stick.addEventListener('pointercancel',endJoy);
let last=0,gameClock=9*60; // Starts at 09:00; one full in-game day lasts 180 real seconds.
function smooth(a,b,x){let t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)}
function updateDayNight(dt,t){gameClock=(gameClock+dt*8)%1440;const minute=Math.floor(gameClock),hh=String(Math.floor(minute/60)).padStart(2,'0'),mm=String(minute%60).padStart(2,'0');const phase=gameClock/1440;const angle=phase*Math.PI*2-Math.PI/2;const sunHeight=Math.sin(angle);const daylight=smooth(-.18,.22,sunHeight);const dusk=Math.max(0,1-Math.abs(sunHeight)*5)* (sunHeight<.28?1:0);const night=1-daylight;const warm=[1.0,.48,.22],day=[.48,.68,.77],dark=[.025,.045,.095];let sky=dark.map((v,i)=>v*(1-daylight)+day[i]*daylight);sky=sky.map((v,i)=>v*(1-dusk*.42)+warm[i]*dusk*.42);gl.clearColor(sky[0],sky[1],sky[2],1);gl.uniform3f(FOGCOLOR,sky[0],sky[1],sky[2]);gl.uniform1f(FOGAMOUNT,0.25+night*.22);const lx=Math.cos(angle),ly=Math.max(.08,sunHeight),lz=.35;gl.uniform3f(LIGHTDIR,lx,ly,lz);gl.uniform1f(AMBIENT,.17+daylight*.43);clockLabel.textContent=(night>.62?'☾ Ночь':dusk>.35?'🌇 Закат':'☀ День')+' · '+hh+':'+mm;}

function skyDecor(t){
 const phase=gameClock/1440,ang=phase*Math.PI*2-Math.PI/2;
 const sunY=8+Math.sin(ang)*7, sunX=px+Math.cos(ang)*17, sunZ=pz-29;
 const daylight=Math.max(0,Math.min(1,(Math.sin(ang)+.18)/.40));
 if(daylight>.03){ball(sunX,sunY,sunZ,1.05,1.05,1.05,[1,.78,.35]);ball(sunX,sunY,sunZ,1.38,1.38,1.38,[1,.86,.54]);}
 if(daylight<.82){let mx=px-Math.cos(ang)*14,my=9-Math.sin(ang)*5,mz=pz-27;ball(mx,my,mz,.72,.72,.72,[.76,.83,.94]);ball(mx+.25,my+.12,mz+.08,.62,.64,.62,[.035,.055,.10]);
  for(let i=0;i<18;i++){let sx=px+Math.sin(i*12.989)*18,sy=9+Math.cos(i*7.31)*5,sz=pz-30-(i%4)*.3;ball(sx,sy,sz,.045,.045,.045,[.78,.84,1]);}}
}

function frame(t){resize();let dt=Math.min((t-last)/1000||0,.04);last=t;updateDayNight(dt,t);let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX,y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joyY;let l=Math.hypot(x,y);if(l>.12){x/=Math.max(1,l);y/=Math.max(1,l);moveWithCollision(x*5*dt,y*5*dt);heading=Math.atan2(x,y)}px=Math.max(-20,Math.min(20,px));pz=Math.max(-20,Math.min(20,pz));gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let aspect=canvas.width/canvas.height;let proj=perspective(Math.PI/3,aspect,.1,120);let eye=[px,10.5,pz+15],target=[px,0.85,pz-1.8];vp=matMul(proj,lookAt(eye,target,[0,1,0]));gl.uniform3f(CAMERAPOS,eye[0],eye[1],eye[2]);world();skyDecor(t);villageLife(t);player();status.textContent='Живая Экетория · жители, животные и динамическое освещение';requestAnimationFrame(frame)}
status.textContent='Создание мира Экетории…';requestAnimationFrame(frame);
})();

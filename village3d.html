<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#18251d" />
<title>Eket Clicker — 3D Деревня</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18251d;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
  #game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #000b}
  .top{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .panel{background:linear-gradient(145deg,#17271fe8,#101912d9);border:1px solid #d5bd8066;border-radius:13px;padding:9px 12px;box-shadow:0 5px 18px #0005;backdrop-filter:blur(7px)}
  .brand{font-weight:800;letter-spacing:.4px;font-size:15px}.sub{font-size:11px;opacity:.8;margin-top:2px}.hint{font-size:11px;max-width:48vw;text-align:right;line-height:1.35}
  #joystick{position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:126px;height:126px;border-radius:50%;pointer-events:auto;background:radial-gradient(circle,#d8d0b522 0 34%,#b5aa7c35 36% 68%,#d8c99a55 70% 73%,#171d17a8 75%);border:2px solid #e6d5a477;box-shadow:0 5px 20px #0007;touch-action:none}
  #stick{position:absolute;width:52px;height:52px;left:35px;top:35px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8dfc7,#92835d 70%,#51462f);border:2px solid #f1dfad;box-shadow:0 4px 12px #0008}
  #buttons{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 25px);display:flex;flex-direction:column;gap:10px;pointer-events:auto}
  button{border:1px solid #e2ca8b99;background:linear-gradient(145deg,#344d38ed,#17291feF);color:#fff;border-radius:12px;padding:11px 14px;font-weight:650;font-size:12px;box-shadow:0 4px 12px #0006;touch-action:manipulation}
  #status{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);font-size:11px;opacity:.8;white-space:nowrap}
  #loading{position:absolute;inset:0;display:grid;place-items:center;background:#18251d;color:#f3e7c5;font-weight:700;z-index:5;text-align:center;padding:24px}
  @media(min-width:800px){#joystick{width:140px;height:140px;left:30px;bottom:28px}#stick{left:42px;top:42px}#status{bottom:12px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">Загружаем 3D-деревню Eket…</div>
<div id="hud">
  <div class="top">
    <div class="panel"><div class="brand">🏰 EKET CLICKER</div><div class="sub">3D • Средневековая деревня</div></div>
    <div class="panel hint">WASD / стрелки — движение<br>Мышь или свайп — осмотр камеры</div>
  </div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="buttons"><button id="reset">Вернуть камеру</button><button id="back">Назад в игру</button></div>
  <div id="status">Исследуй деревню</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const mount=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9db8c0);
scene.fog=new THREE.Fog(0x9db8c0,42,115);
const camera=new THREE.PerspectiveCamera( sixty(),innerWidth/innerHeight,.1,220);
function sixty(){return 62}
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdcecff,0x596044,2.0));
const sun=new THREE.DirectionalLight(0xffe2b2,2.6);sun.position.set(-28,42,22);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;sun.shadow.bias=-.00025;scene.add(sun);
const mat=(color,rough=.9)=>new THREE.MeshStandardMaterial({color,roughness:rough});
const grass=mat(0x536d3d),darkGrass=mat(0x3f5934),dirt=mat(0x92734c),stone=mat(0x777a72),stone2=mat(0x96958a),wood=mat(0x65452e),woodLight=mat(0x8b633d),roof=mat(0x554039),roofRed=mat(0x70483b),plaster=mat(0xc5b18a),plaster2=mat(0x9eaa8b),metal=mat(0x454b4b,.55),water=mat(0x477f91,.3),leaf=mat(0x3f6338),leaf2=mat(0x557641);
function box(parent,x,y,z,sx,sy,sz,material,cast=true){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m}
function cylinder(parent,x,y,z,rt,rb,h,material,seg=8){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function group(parent,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);return g}
// Ground and village clearing
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
// irregular grass tufts / stones
for(let i=0;i<230;i++){let x=(Math.random()-.5)*95,z=(Math.random()-.5)*95;if(Math.abs(x)<20&&Math.abs(z)<18)continue;const r=.12+Math.random()*.32;const m=new THREE.Mesh(new THREE.DodecahedronGeometry(r,0),Math.random()>.5?darkGrass:leaf);m.position.set(x,r*.35,z);m.scale.y=.35;m.rotation.y=Math.random()*6;m.receiveShadow=true;scene.add(m)}
// Main roads
function path(x,z,w,d){const p=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),dirt);p.position.set(x,-.035,z);p.receiveShadow=true;scene.add(p);for(let i=0;i<Math.floor(w*d*.18);i++){const sx=x+(Math.random()-.5)*w*.92,sz=z+(Math.random()-.5)*d*.92;const s=new THREE.Mesh(new THREE.DodecahedronGeometry(.12+Math.random()*.17,0),Math.random()>.5?stone:stone2);s.position.set(sx,.025,sz);s.scale.y=.25;s.rotation.y=Math.random()*3;s.receiveShadow=true;scene.add(s)}}
path(0,0,9,65);path(0,0,52,8);path(-22,0,8,35);path(22,0,8,35);path(0,-29,36,7);
// plaza stones
const plaza= new THREE.Mesh(new THREE.CircleGeometry(8,12),stone);plaza.rotation.x=-Math.PI/2;plaza.position.set(0,.015,0);plaza.receiveShadow=true;scene.add(plaza);
for(let i=0;i<48;i++){const a=i/48*Math.PI*2,r=2.2+Math.random()*5.4;const s=new THREE.Mesh(new THREE.DodecahedronGeometry(.25+Math.random()*.24,0),i%3?stone2:stone);s.position.set(Math.cos(a)*r,.08,Math.sin(a)*r);s.scale.set(1,.25,.8);s.rotation.y=a;scene.add(s)}
// Well
const well=group(0,0,0);cylinder(well,0,.52,0,1.35,1.5,1.05,stone,12);cylinder(well,0,1.08,0,1.42,1.42,.16,stone2,12);cylinder(well,0,1.17,0,1.12,1.12,.06,water,16);
box(well,-1.05,2.05,0,.18,2,.18,wood);box(well,1.05,2.05,0,.18,2,.18,wood);box(well,0,3.05,0,2.45,.18,.18,wood);const roofWell=new THREE.Mesh(new THREE.ConeGeometry(1.7,.9,4),roofRed);roofWell.position.set(0,3.65,0);roofWell.rotation.y=Math.PI/4;roofWell.castShadow=true;well.add(roofWell);cylinder(well,0,2.1,0,.055,.055,1.8,woodLight,8);
// Houses with gabled roofs
function house(x,z,scale=1,wall=plaster,roofMat=roof,angle=0){const h=group(scene,x,0,z);h.rotation.y=angle;h.scale.setScalar(scale);box(h,0,1.45,0,6,2.9,5,wall);box(h,0,.18,2.56,1.15,2.15,.12,wood);box(h,-1.65,1.75,2.57,.9,.95,.13,woodLight);box(h,1.65,1.75,2.57,.9,.95,.13,woodLight);box(h,-1.65,1.75,2.66,.12,.85,.08,wood);box(h,1.65,1.75,2.66,.12,.85,.08,wood);box(h,0,1.75,2.66,.85,.12,.08,wood);
 // timber framing
 for(let xx of [-2.8,2.8])box(h,xx,1.45,2.56,.16,2.9,.16,wood);box(h,0,2.8,2.56,5.7,.16,.16,wood);
 // roof two sloping planes
 const r1=box(h,-1.52,3.55,0,3.55,.22,5.9,roofMat);r1.rotation.z=-.55;const r2=box(h,1.52,3.55,0,3.55,.22,5.9,roofMat);r2.rotation.z=.55;
 box(h,0,4.52,0,.22,.22,6.05,wood);
 // chimney
 box(h,-1.8,4.05,-1.2,.65,1.8,.65,stone);
 // side windows
 box(h,-3.06,1.8,-.7,.1,.9,.9,woodLight);box(h,3.06,1.8,-.7,.1,.9,.9,woodLight);
 return h;}
house(-13,-12,1.05,plaster,roofRed,.25);house(13,-13,1.0,plaster2,roof,.0);house(-14,12,.95,plaster2,roofRed,-.15);house(14,13,1.1,plaster,roof,.2);house(-31,-8,1.05,plaster,roofRed,Math.PI/2);house(31,8,1.05,plaster2,roof,Math.PI/2);
// Blacksmith forge and anvil
const forge=group(scene,-23,0,19);box(forge,0,1.4,0,7,2.8,5,plaster2);box(forge,0,3.25,-.2,7.8,.22,5.8,roofRed);const fRoof1=box(forge,-1.8,3.9,0,4,.2,6,roofRed);fRoof1.rotation.z=-.48;const fRoof2=box(forge,1.8,3.9,0,4,.2,6,roofRed);fRoof2.rotation.z=.48;box(forge,-2.2,1.25,2.56,1.5,1.7,.2,metal);box(forge,2.1,1.0,2.6,1.2,.18,.9,metal);cylinder(forge,2.1,1.35,2.6,.18,.35,.55,metal,8);box(forge,-2.2,.35,2.7,1.3,.3,.8,wood);const fire=new THREE.PointLight(0xff762e,2.2,10);fire.position.set(-2.2,1.3,3.3);forge.add(fire);const flame=new THREE.Mesh(new THREE.ConeGeometry(.38,1.15,7),new THREE.MeshBasicMaterial({color:0xff8a32}));flame.position.set(-2.2,1.2,3.15);forge.add(flame);
// Tavern sign
const tavern=house(23,-29,1.1,plaster,roofRed,0);box(tavern,0,2.25,2.95,1.7,.65,.14,wood);const signText=box(tavern,0,2.25,3.04,1.35,.35,.04,plaster);
// Fence segments
function fence(x,z,len,axis='x'){for(let i=0;i<=len;i+=1.8){if(axis==='x')box(scene,x+i,.55,z,.13,1.1,.13,wood);else box(scene,x,.55,z+i,.13,1.1,.13,wood)}if(axis==='x'){box(scene,x+len/2,.72,z, len, .14,.14,woodLight);box(scene,x+len/2,.28,z,len,.14,.14,woodLight)}else{box(scene,x,.72,z+len/2,.14,.14,len,woodLight);box(scene,x,.28,z+len/2,.14,.14,len,woodLight)}}
fence(-34,-24,18);fence(-34,-24,15,'z');fence(26,23,15);fence(26,23,16,'z');
// Trees: trunk and layered foliage
function tree(x,z,s=1){const t=group(scene,x,0,z);cylinder(t,0,1.5,0,.28*s,.42*s,3*s,wood,7);for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.IcosahedronGeometry((1.45-i*.13)*s,1),i===1?leaf2:leaf);c.position.set((Math.random()-.5)*.25*s,(3.0+i*.8)*s,0);c.scale.set(1,1.05,1);c.castShadow=true;c.receiveShadow=true;t.add(c)}return t}
for(const [x,z,s] of [[-39,-30,1.3],[-45,-18,1.5],[-40,3,1.2],[-39,29,1.5],[-30,37,1.25],[-19,39,1.5],[-5,42,1.3],[12,42,1.5],[30,39,1.3],[42,27,1.5],[43,5,1.2],[42,-17,1.45],[35,-39,1.4],[14,-42,1.2],[-12,-42,1.4],[-37,-42,1.2],[-48,15,1.5],[48,-35,1.4]])tree(x,z,s);
// Bushes and barrels around buildings
function barrel(x,z){const b=group(scene,x,0,z);cylinder(b,0,.48,0,.42,.48,.95,woodLight,10);for(let y of [.18,.75]){const ring=new THREE.Mesh(new THREE.TorusGeometry(.43,.055,6,12),metal);ring.rotation.x=Math.PI/2;ring.position.y=y;b.add(ring)}}
barrel(-18,-9);barrel(17,-10);barrel(19,15);barrel(-27,22);
// Simple stylized 3D adventurer
const hero=group(scene,0,0,10);const bodyMat=mat(0x344c70,.72),skin=mat(0xd1a27d),leather=mat(0x65432c),gold=mat(0xc5a04e,.55);
const torso=box(hero,0,1.25,0,.82,1.05,.48,bodyMat);const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),skin);head.position.set(0,2.05,0);head.castShadow=true;hero.add(head);const hood=new THREE.Mesh(new THREE.SphereGeometry(.37,12,8,0,Math.PI*2,0,Math.PI*.56),leather);hood.position.set(0,2.14,-.02);hood.castShadow=true;hero.add(hood);
box(hero,0,.57,0,.72,.28,.48,leather);for(let x of [-.23,.23]){const leg=box(hero,x,.27,0,.25,.55,.3,leather);leg.position.y=.28}
for(let x of [-.57,.57]){const arm=box(hero,x,1.35,0,.24,.8,.27,bodyMat);arm.rotation.z=x<0?-.16:.16}
const cape=box(hero,0,1.27,-.32,.68,.95,.13,mat(0x8a302c));cape.rotation.x=-.12;
// sword on right hand
const sword=group(hero,.67,1.12,.03);const blade=box(sword,0,.45,.05,.11,.9,.09,stone2);const guard=box(sword,0,.02,.05,.42,.09,.13,gold);const grip=box(sword,0,-.18,.05,.12,.3,.12,leather);sword.rotation.z=-.28;
const heroShadow=new THREE.Mesh(new THREE.CircleGeometry(.65,20),new THREE.MeshBasicMaterial({color:0x172018,transparent:true,opacity:.32}));heroShadow.rotation.x=-Math.PI/2;heroShadow.position.y=.015;hero.add(heroShadow);
// Collision obstacles (rough bounds)
const obstacles=[[-13,-12,3.8,3.8],[13,-13,3.8,3.8],[-14,12,3.8,3.8],[14,13,3.8,3.8],[-31,-8,3.5,3.5],[31,8,3.5,3.5],[-23,19,4.5,4],[23,-29,4.5,4], [0,0,1.7,1.7]];
// Camera and controls
let yaw=0,camYaw=0,moveX=0,moveY=0,keys={},dragging=false,lastX=0;let lastTime=performance.now();
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');let joyPointer=null;
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=43,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.transform=`translate(${dx}px,${dy}px)`;moveX=dx/max;moveY=-dy/max}
joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joyMove(e)});function joyEnd(e){if(e.pointerId===joyPointer){joyPointer=null;moveX=moveY=0;stick.style.transform='translate(0,0)'}}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.clientX>160){dragging=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(dragging){camYaw-=(e.clientX-lastX)*.005;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
// On touch, swipe on right half rotates camera
let touchId=null,touchX=0;renderer.domElement.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.clientX>innerWidth*.45){touchId=t.identifier;touchX=t.clientX;break}}},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===touchId){camYaw-=(t.clientX-touchX)*.006;touchX=t.clientX}},{passive:true});renderer.domElement.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===touchId)touchId=null},{passive:true});
document.getElementById('reset').onclick=()=>{camYaw=0};document.getElementById('back').onclick=()=>{location.href='index.html'};
function update(dt){let ix=moveX,iy=moveY;if(keys.w||keys.arrowup)iy=1;if(keys.s||keys.arrowdown)iy=-1;if(keys.a||keys.arrowleft)ix=-1;if(keys.d||keys.arrowright)ix=1;const l=Math.hypot(ix,iy);if(l>.08){ix/=Math.max(1,l);iy/=Math.max(1,l);const forward=new THREE.Vector3(Math.sin(camYaw),0,Math.cos(camYaw));const right=new THREE.Vector3(Math.cos(camYaw),0,-Math.sin(camYaw));const dir=right.multiplyScalar(ix).add(forward.multiplyScalar(iy)).normalize();const speed=5.1;const nx=hero.position.x+dir.x*speed*dt,nz=hero.position.z+dir.z*speed*dt;let blocked=false;for(const [x,z,rx,rz] of obstacles)if(Math.abs(nx-x)<rx&&Math.abs(nz-z)<rz)blocked=true;if(!blocked&&Math.abs(nx)<62&&Math.abs(nz)<62){hero.position.x=nx;hero.position.z=nz}const target=Math.atan2(dir.x,dir.z);let diff=((target-yaw+Math.PI*3)%(Math.PI*2))-Math.PI;yaw+=diff*Math.min(1,dt*11);hero.rotation.y=yaw;}
// Camera follows behind, without rotating the world
const backAngle=yaw+camYaw;const desired=new THREE.Vector3(hero.position.x-Math.sin(backAngle)*7,4.4,hero.position.z-Math.cos(backAngle)*7);camera.position.lerp(desired,1-Math.exp(-dt*4.5));const look=new THREE.Vector3(hero.position.x,1.35,hero.position.z);camera.lookAt(look);
}
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-lastTime)/1000);lastTime=now;update(dt);fire.intensity=2.0+Math.sin(now*.009)*.22;renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
requestAnimationFrame(()=>{document.getElementById('loading').style.display='none';animate(performance.now())});
</script>
</body>
</html>

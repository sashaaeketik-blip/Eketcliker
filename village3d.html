<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),status=document.getElementById('status'),error=document.getElementById('error');

const vs=`attribute vec3 p; attribute vec3 n; uniform mat4 mvp; uniform mat4 model; varying float light; varying vec3 worldPos; void main(){vec3 nn=normalize(mat3(model)*n); light=0.48+0.52*max(dot(nn,normalize(vec3(-0.4,0.9,0.35))),0.0); worldPos=(model*vec4(p,1.0)).xyz; gl_Position=mvp*vec4(p,1.0);}`;

function perspective(fovy,aspect,near,far){let f=1/Math.tan(fovy/2),nf=1/(near-far),o=new Float32Array(16);o[0]=f/aspect;o[5]=f;o[10]=(far+near)*nf;o[11]=-1;o[14]=2*far*near*nf;return o}
function lookAt(eye,center,up){let z=norm(sub(eye,center)),x=norm(cross(up,z)),y=cross(z,x),o=new Float32Array(16);o[0]=x[0];o[1]=y[0];o[2]=z[0];o[4]=x[1];o[5]=y[1];o[6]=z[1];o[8]=x[2];o[9]=y[2];o[10]=z[2];o[12]=-dot(x,eye);o[13]=-dot(y,eye);o[14]=-dot(z,eye);o[15]=1;return o}
const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{let l=Math.hypot(...a)||1;return a.map(v=>v/l)};

function tree(x,z,k=1){

 draw(x+.42*k,2.65*k,z-.12*k,1.35*k,1.4*k,1.35*k,C.leaf3);

function world(){

 // cobblestone road: irregular pavers

  for(let lane=-1;lane<=1;lane++){
   let x=lane*.0 + ((i%2)*.22), z=i*1.65;
   draw(x,-.045,z,1.45,.12,1.35,(i+lane)%3===0?C.stone2:C.stone,((i*lane)%4)*.06);
  }
 }
 for(let i=-11;i<=11;i++){
  for(let lane=-1;lane<=1;lane++){
   let x=i*1.7,z=lane*1.42+((i%2)*.2);
   draw(x,-.035,z,1.35,.1,1.15,(i+lane)%3===0?C.stone2:C.stone,.04);

 // central square and circular well base

 for(let i=0;i<12;i++){let a=i*Math.PI/6;draw(Math.cos(a)*2.1,-.005,Math.sin(a)*2.1,.95,.12,.85,C.stone,.18)}

 draw(-.82,1.65,0,.16,2.0,.16,C.wood);draw(.82,1.65,0,.16,2.0,.16,C.wood);
 draw(0,2.55,0,2.25,.18,.2,C.wood3);draw(0,2.95,0,2.5,.12,1.5,C.roof2,.08);
 // houses around square

 // blacksmith building and forge chimney

 draw(-3,3.55,6,1.35,1.0,1.35,C.roof2,.58);draw(-3,3.55,6,1.35,1.0,1.35,C.roof2,-.58);
 draw(-4.25,3.3,5.25,.62,2.55,.62,C.stone);draw(-4.25,4.65,5.25,.82,.22,.82,C.dark);

 // warm forge glow and sign

 // blacksmith work area: stacked firewood, barrels and supply crates

 draw(-1.25,.42,7.65,.78,.82,.72,C.wood2);draw(-1.25,.86,7.65,.84,.12,.78,C.wood3);

  draw(lx,2.35,lz,.42,.42,.42,C.dark);
  draw(lx,2.35,lz+.23,.24,.25,.08,C.warm);
  draw(lx,2.62,lz,.32,.08,.32,C.wood3);
 }
 // fenced garden beds with visible rows of crops
 for(let bed=0;bed<3;bed++){
  let bx=11+bed*1.25;
  draw(bx,-.01,6.8,1.05,.10,3.8,C.road);
  for(let row=0;row<4;row++)for(let plant=0;plant<5;plant++){

   draw(bx-.25+row*.16,.18,zz,.10,.34,.10,row%2?C.grass3:C.leaf2);

 for(let i=0;i<7;i++){let z=7+i*.7;draw(-15,.48,z,.12,.95,.12,C.wood);draw(-15,.72,z+.35,.12,.12,.78,C.wood3)}
 // scattered stones, grass clumps and flower dots along lawn edges

  let x=((i*37)%43)-21,z=((i*19)%39)-19;
  if(Math.abs(x)<4.2||Math.abs(z)<3.8)continue;

function player(){

 draw(px-.20,.53,pz,.25,.48,.28,C.cloth,heading);draw(px+.20,.53,pz,.25,.48,.28,C.cloth,heading);
 draw(px,.91,pz,.66,.72,.42,C.cloth,heading);
 draw(px,.98,pz+fz*.23,.48,.13,.07,C.gold,heading);
 draw(px-sideX*.43,.91,pz-sideZ*.43,.22,.68,.25,C.wood2,heading);
 draw(px+sideX*.43,.91,pz+sideZ*.43,.22,.68,.25,C.cloth,heading);

function resize(){let d=Math.min(devicePixelRatio||1,1.5),w=Math.floor(innerWidth*d),h=Math.floor(innerHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}
